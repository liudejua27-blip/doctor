[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "body-companion-backend"
version = "0.1.0"
description = "Phase 1 Agent and deterministic safety prototype for AI Body Companion"
requires-python = ">=3.10"
dependencies = [
  "pydantic-ai-slim==2.23.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
