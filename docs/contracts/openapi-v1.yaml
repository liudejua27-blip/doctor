components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token；资源所有者由服务端认证上下文决定。

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 客户端请求 UUID；服务端会返回最终 request ID。
      schema:
        type: string
        format: uuid
    ClientVersion:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        example: zh-CN
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        同一用户动作重试必须复用。不含健康正文的 key/作用域/请求哈希/执行状态/不透明结果引用至少保留 7 天；
        可重放的响应正文保留期不得长于其来源 Session/草稿/同意 TTL，清理后同 key 只返回稳定墓碑/410，不还原旧正文。
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[!-~]{8,128}$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 资源并发 revision 的强 ETag，例如 "4"。若请求体也有 expected_revision 或 BodySignalEvent 的 expected_resource_revision，两者必须一致。
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: 没有请求体 expected_revision/expected_resource_revision 的写操作必须携带资源并发 revision 强 ETag，例如 "4"。
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    RecentAuthToken:
      name: X-Reauthentication-Token
      in: header
      required: true
      description: 近期重新认证产生的短期、单用户、单用途令牌；不得记录到日志。
      schema:
        type: string
        minLength: 20
        maxLength: 2048
    ConditionalRecentAuthToken:
      name: X-Reauthentication-Token
      in: header
      required: false
      description: approve 时必须提供仍有效、单用户、单用途的近期认证令牌；deny 可省略，避免阻碍拒绝。服务端按请求 decision 强制并不得写日志。
      schema:
        type: string
        minLength: 20
        maxLength: 2048
    ConsentScope:
      name: consent_scope
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConsentScope'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TurnId:
      name: turn_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: share_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: 不透明且绑定当前用户和查询条件的游标。
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    RequestId:
      description: 服务端最终 request ID。
      schema:
        type: string
        format: uuid
    ETag:
      description: 资源 revision 的强 ETag。
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Location:
      description: 新建资源或异步资源的相对/绝对位置。
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: 建议等待秒数。
      schema:
        type: integer
        minimum: 1
    IdempotencyReplayed:
      description: true 表示返回先前已提交动作的结果。
      schema:
        type: boolean

  schemas:
    IOSAppConfiguration:
      type: object
      additionalProperties: false
      required: [config_version, minimum_build, minimum_read_only_build, api_contract_version, supported_schema_versions, capabilities, body_assets, safety_content, issued_at, expires_at, config_digest, signature_algorithm, signing_key_id, signature]
      properties:
        config_version: {type: string, pattern: '^[A-Za-z0-9._-]{1,64}$'}
        minimum_build: {type: integer, minimum: 1}
        minimum_read_only_build: {type: integer, minimum: 1}
        api_contract_version: {type: string, const: '1.0'}
        supported_schema_versions:
          type: array
          minItems: 1
          uniqueItems: true
          description: 支持的公开/客户端机器契约版本；P1D iOS 结构化录入从 1.1 起使用显式感觉位置关系。
          items: {type: string, enum: ['1.0', '1.1']}
        capabilities:
          type: object
          additionalProperties: false
          required: [body_map_2d, default_3d, professional_3d, agent_analysis, manual_recording, report_generation, system_share, expiring_link_share]
          properties:
            body_map_2d: {type: string, const: enabled}
            default_3d: {type: string, enum: [enabled, disabled]}
            professional_3d: {type: string, enum: [enabled, disabled]}
            agent_analysis: {type: string, enum: [enabled, manual_only, disabled]}
            manual_recording: {type: string, const: enabled}
            report_generation: {type: string, enum: [enabled, disabled]}
