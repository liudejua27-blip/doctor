    ConsentStatus:
      type: object
      additionalProperties: false
      required:
        - scope
        - status
        - required_for_core
        - current_notice_version
        - latest_receipt_id
        - purpose_ids
        - data_categories
        - recipient_classes
        - last_used_at
        - last_used_purpose_id
        - granted_at
        - expires_at
      properties:
        scope:
          $ref: '#/components/schemas/ConsentScope'
        status:
          type: string
          enum: [not_granted, granted, withdrawn, expired, renewed_consent_required]
        required_for_core:
          type: boolean
        latest_receipt_id:
          type: [string, 'null']
          format: uuid
        current_notice_version:
          type: string
          minLength: 1
          maxLength: 64
        purpose_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 120
        data_categories:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 120
        recipient_classes:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 120
        last_used_at:
          type: [string, 'null']
          format: date-time
        last_used_purpose_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
        granted_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
      allOf:
        - if:
            properties: {status: {enum: [granted, withdrawn, expired, renewed_consent_required]}}
            required: [status]
          then:
            properties:
              latest_receipt_id:
                type: string
                format: uuid
        - if:
            properties: {status: {const: granted}}
            required: [status]
          then:
            properties:
              latest_receipt_id:
                type: string
                format: uuid
              purpose_ids:
                type: array
                minItems: 1
              data_categories:
                type: array
                minItems: 1
              recipient_classes:
                type: array
                minItems: 1
              granted_at:
                type: string
                format: date-time
        - if:
            properties: {status: {const: not_granted}}
            required: [status]
          then:
            properties:
              latest_receipt_id: {type: 'null'}
              purpose_ids: {type: array, maxItems: 0}
              data_categories: {type: array, maxItems: 0}
              recipient_classes: {type: array, maxItems: 0}
              last_used_at: {type: 'null'}
              last_used_purpose_id: {type: 'null'}
              granted_at: {type: 'null'}
              expires_at: {type: 'null'}
        - if:
            properties:
              last_used_at: {type: string, format: date-time}
            required: [last_used_at]
          then:
            properties:
              last_used_purpose_id: {type: string, minLength: 1, maxLength: 120}
        - if:
            properties:
              last_used_purpose_id: {type: string, minLength: 1, maxLength: 120}
            required: [last_used_purpose_id]
          then:
            properties:
              last_used_at: {type: string, format: date-time}
        - if:
            properties: {last_used_at: {type: 'null'}}
            required: [last_used_at]
          then:
            properties: {last_used_purpose_id: {type: 'null'}}
        - if:
            properties: {last_used_purpose_id: {type: 'null'}}
            required: [last_used_purpose_id]
          then:
            properties: {last_used_at: {type: 'null'}}

