      operationId: startEscalationRecordReview
      summary: 在 R0/R1 行动信息已优先展示后开始事实留档复核
      description: |
        仅接受 latest Turn 为 escalated、record_review_available=true 且未确认草稿未过期的 Session。
        本操作不得替代、遮挡或延迟紧急/专业帮助主入口，也不得调用 LLM；Application Service 从服务端
        已保存输入生成 workflow=post_escalation_record 的 draft_ready Turn，保留原 R0/R1 SafetyBaseline，
        然后复用 confirmations 与 ApprovalIntent 两阶段确认。它只开始复核，不直接创建正式 Event。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEscalationRecordReviewRequest'
      responses:
        '201':
          description: 事实留档复核 Turn 已创建；仍未写入正式 Event
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
