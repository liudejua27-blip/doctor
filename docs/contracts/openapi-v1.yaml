          properties:
            default_asset_id: {type: string, minLength: 1, maxLength: 120}
            default_asset_version: {type: string, minLength: 1, maxLength: 64}
            ontology_version: {type: string, minLength: 1, maxLength: 64}
            professional_asset_id: {type: [string, 'null'], maxLength: 120}
            professional_asset_version: {type: [string, 'null'], maxLength: 64}
        safety_content:
