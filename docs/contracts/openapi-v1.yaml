          maxItems: 100
          items:
            $ref: '#/components/schemas/SafetyAnswerInput'
        locale:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
        requested_rule_set_version:
          type: string
          minLength: 1
          maxLength: 64

    SafetyAnswerInput:
      type: object
      additionalProperties: false
      required: [question_id, answer_type, answer_state]
      properties:
        question_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,120}$'
        answer_type:
          type: string
          enum: [boolean, single_choice, multiple_choice]
        answer_state:
          type: string
          enum: [answered, uncertain, not_answered]
        boolean_value:
          type: boolean
        choice_values:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 120
        user_text:
          type: string
          minLength: 1
          maxLength: 1000
      allOf:
        - if:
            properties:
              answer_state: {const: answered}
              answer_type: {const: boolean}
            required: [answer_state, answer_type]
          then:
            required: [boolean_value]
            not:
              required: [choice_values]
        - if:
            properties:
              answer_state: {const: answered}
              answer_type: {const: single_choice}
            required: [answer_state, answer_type]
          then:
            required: [choice_values]
            properties:
              choice_values:
                type: array
                minItems: 1
                maxItems: 1
            not:
              required: [boolean_value]
        - if:
            properties:
              answer_state: {const: answered}
              answer_type: {const: multiple_choice}
            required: [answer_state, answer_type]
          then:
            required: [choice_values]
            properties:
              choice_values:
                type: array
                minItems: 1
            not:
              required: [boolean_value]
        - if:
            properties: {answer_state: {enum: [uncertain, not_answered]}}
            required: [answer_state]
          then:
            not:
              anyOf:
                - required: [boolean_value]
                - required: [choice_values]

    SafetyQuestion:
      type: object
      additionalProperties: false
      required: [question_id, prompt, answer_type, required]
      properties:
        question_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,120}$'
        prompt:
          type: string
          minLength: 1
          maxLength: 500
        answer_type:
          type: string
          enum: [boolean, single_choice, multiple_choice]
        choices:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value:
                type: string
                minLength: 1
                maxLength: 120
              label:
                type: string
                minLength: 1
                maxLength: 200
        required:
          type: boolean
          const: true
      allOf:
        - if:
            properties: {answer_type: {enum: [single_choice, multiple_choice]}}
            required: [answer_type]
          then:
            required: [choices]
            properties:
              choices:
                type: array
                minItems: 1
          else:
            not:
              required: [choices]

    SafetyPrecheckResult:
      type: object
      additionalProperties: false
      required: [gate, required_questions, immediate_action, safetyBaselineId]
      properties:
        gate:
          $ref: ./agent-turn.schema.json#/$defs/DeterministicSafetyGate
        required_questions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SafetyQuestion'
        immediate_action:
          type: object
          additionalProperties: false
          required: [code, content_id, content_release_id, display_message, ordinary_advice_suppressed]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 120
            content_id:
              type: string
              minLength: 1
              maxLength: 160
              description: 审核内容库中的稳定 ID，不得由模型生成。
            content_release_id:
              type: string
              minLength: 1
              maxLength: 64
            display_message:
              type: string
              minLength: 1
              maxLength: 2000
              description: Content Service 按 content_id 和地区/语言解析出的已审核文案。
            ordinary_advice_suppressed:
              type: boolean
        safetyBaselineId:
          type: string
          minLength: 1
          pattern: '^[A-Za-z0-9._:-]{1,120}$'
          maxLength: 120
      allOf:
        - if:
            properties:
              gate:
                type: object
                properties: {status: {const: incomplete}}
                required: [status]
            required: [gate]
          then:
            properties:
              required_questions:
                type: array
                minItems: 1
        - if:
            properties:
              gate:
                type: object
                properties: {status: {enum: [complete, unavailable]}}
                required: [status]
            required: [gate]
          then:
            properties:
              required_questions:
                type: array
                maxItems: 0
        - if:
            properties:
              gate:
                type: object
                properties:
                  tier:
                    enum: [R0, R1]
                required: [tier]
            required: [gate]
          then:
            properties:
              immediate_action:
                type: object
                properties:
                  ordinary_advice_suppressed:
                    const: true
                required: [ordinary_advice_suppressed]
        - if:
            properties:
              gate:
                type: object
                properties:
                  ordinary_agent_allowed:
                    const: false
                required: [ordinary_agent_allowed]
            required: [gate]
          then:
            properties:
              immediate_action:
                type: object
                properties:
                  ordinary_advice_suppressed:
                    const: true
                required: [ordinary_advice_suppressed]
        - if:
            properties:
              gate:
                type: object
                properties:
                  ordinary_agent_allowed:
                    const: true
                required: [ordinary_agent_allowed]
            required: [gate]
          then:
            properties:
              immediate_action:
                type: object
                properties:
                  ordinary_advice_suppressed:
                    const: false
                required: [ordinary_advice_suppressed]

    RetainedSafetyAction:
      type: object
      additionalProperties: false
      description: R0/R1 及保守 R2 升级 Session 持续置顶的原安全行动快照；R0/R1 留档复核、审批、执行或失败期间不得被覆盖。
      required: [tier, code, content_id, content_release_id, display_message, ordinary_advice_suppressed, safetyBaselineId, source_turn_id, presented_at]
      properties:
        tier: {type: string, enum: [R0, R1, R2]}
        code: {type: string, pattern: '^[A-Z0-9._-]{1,120}$'}
        content_id: {type: string, minLength: 1, maxLength: 160}
        content_release_id: {type: string, minLength: 1, maxLength: 64}
        display_message: {type: string, minLength: 1, maxLength: 2000}
        ordinary_advice_suppressed: {type: boolean, const: true}
        safetyBaselineId: {type: string, pattern: '^[A-Za-z0-9._:-]{1,120}$'}
        source_turn_id: {type: string, format: uuid}
        presented_at: {type: string, format: date-time}

    StartAssessmentRequest:
      type: object
      additionalProperties: false
      required: [purpose, locale, timezone, client_context]
      properties:
        purpose:
          type: string
          const: body_signal_assessment
        episode_id:
          type: [string, 'null']
          format: uuid
        locale:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        client_context:
          $ref: '#/components/schemas/ClientContext'

    ClientContext:
      type: object
      additionalProperties: false
      required: [entry_point, view_mode]
      properties:
        entry_point:
          type: string
          enum: [body_map, episode_check_in, text_entry, report_followup]
        view_mode:
          type: string
          enum: [two_d, default_3d, professional_3d, body_part_search]
        installation_id:
          type: string
          format: uuid

    AssessmentSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - purpose
        - workflow
        - state
        - revision
        - allowed_actions
        - created_at
        - updated_at
        - expires_at
      properties:
        session_id:
          type: string
          format: uuid
        purpose:
          type: string
          const: body_signal_assessment
        workflow:
          type: string
          enum: [assessment, post_escalation_record]
        episode_id:
          type: [string, 'null']
          format: uuid
        source_event_id:
          type: [string, 'null']
          format: uuid
          description: 仅修订会话设置；最终确认 Event 的 supersedes_event_id 必须与之相同。
        state:
          type: string
          enum:
            - created
            - collecting
            - awaiting_user
            - safety_review
            - awaiting_confirmation
            - awaiting_approval
            - persisting
            - escalated
            - completed
            - failed
            - expired
        revision:
          type: integer
          minimum: 1
        latest_turn_id:
          type: [string, 'null']
          format: uuid
        retained_safety_action:
          $ref: '#/components/schemas/RetainedSafetyAction'
        allowed_actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - submit_turn
              - poll_turn
              - review_draft
              - confirm_facts
              - edit_draft
              - save_unconfirmed_draft
              - review_approval
              - approve_action
              - deny_action
              - retry
              - get_professional_help
              - get_emergency_help
              - review_escalation_record
              - view_record
              - start_new_session
              - close_session
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties: {state: {const: created}}
            required: [state]
          then:
            properties:
              workflow: {const: assessment}
              latest_turn_id: {type: 'null'}
              allowed_actions:
                type: array
                minItems: 1
                items: {enum: [submit_turn, close_session]}
                contains: {const: submit_turn}
                minContains: 1
            not:
              required: [retained_safety_action]
        - if:
            properties: {state: {enum: [collecting, safety_review, persisting]}}
            required: [state]
          then:
            required: [latest_turn_id]
            properties:
              latest_turn_id:
                type: string
                format: uuid
              allowed_actions:
                type: array
                minItems: 1
                items: {enum: [poll_turn, close_session, get_professional_help, get_emergency_help]}
                contains: {const: poll_turn}
                minContains: 1
        - if:
            properties: {state: {const: awaiting_user}}
            required: [state]
          then:
            required: [latest_turn_id]
            properties:
              latest_turn_id:
                type: string
                format: uuid
              allowed_actions:
                type: array
                minItems: 1
                items: {enum: [submit_turn, save_unconfirmed_draft, close_session, get_professional_help, get_emergency_help]}
                contains: {const: submit_turn}
                minContains: 1
        - if:
            properties: {state: {const: awaiting_confirmation}}
            required: [state]
          then:
            required: [latest_turn_id]
            properties:
              latest_turn_id:
                type: string
                format: uuid
              allowed_actions:
                type: array
                minItems: 2
                items: {enum: [review_draft, edit_draft, confirm_facts, save_unconfirmed_draft, close_session, get_professional_help, get_emergency_help]}
                allOf:
                  - contains: {const: review_draft}
                    minContains: 1
                  - contains: {const: confirm_facts}
                    minContains: 1
        - if:
            properties: {state: {const: awaiting_approval}}
            required: [state]
          then:
            required: [latest_turn_id]
            properties:
              latest_turn_id:
                type: string
                format: uuid
              allowed_actions:
                type: array
                minItems: 3
                items: {enum: [review_approval, approve_action, deny_action, close_session, get_professional_help, get_emergency_help]}
                allOf:
                  - contains: {const: review_approval}
                    minContains: 1
                  - contains: {const: approve_action}
                    minContains: 1
                  - contains: {const: deny_action}
                    minContains: 1
        - if:
            properties: {state: {const: escalated}}
            required: [state]
          then:
            required: [latest_turn_id, retained_safety_action]
            properties:
              latest_turn_id:
                type: string
                format: uuid
              allowed_actions:
                type: array
                minItems: 1
                items: {enum: [get_professional_help, get_emergency_help, review_escalation_record, close_session]}
                contains: {enum: [get_professional_help, get_emergency_help]}
                minContains: 1
        - if:
            properties: {state: {const: completed}}
            required: [state]
          then:
            required: [latest_turn_id]
            properties:
              latest_turn_id:
                type: string
                format: uuid
              allowed_actions:
                type: array
                minItems: 1
                items: {enum: [view_record, start_new_session, close_session, get_professional_help, get_emergency_help]}
                contains: {const: view_record}
                minContains: 1
        - if:
            allOf:
              - properties: {workflow: {const: post_escalation_record}}
                required: [workflow]
              - properties:
                  state:
                    enum: [collecting, awaiting_user, safety_review, awaiting_confirmation, awaiting_approval, persisting, completed, failed]
                required: [state]
          then:
            required: [retained_safety_action, latest_turn_id]
            properties:
              latest_turn_id: {type: string, format: uuid}
        - if:
            properties: {workflow: {const: post_escalation_record}}
            required: [workflow]
          then:
            properties:
              state:
                enum: [collecting, awaiting_user, safety_review, awaiting_confirmation, awaiting_approval, persisting, completed, failed, expired]
              retained_safety_action:
                type: object
                properties: {tier: {enum: [R0, R1]}}
                required: [tier]
        - if:
            allOf:
              - properties: {workflow: {const: assessment}}
                required: [workflow]
              - properties:
                  state:
                    enum: [created, collecting, awaiting_user, safety_review, awaiting_confirmation, awaiting_approval, persisting, completed, failed, expired]
                required: [state]
          then:
            not:
              required: [retained_safety_action]
        - if:
            allOf:
              - required: [retained_safety_action]
              - properties:
                  state:
                    enum: [collecting, awaiting_user, safety_review, awaiting_confirmation, awaiting_approval, persisting, completed, failed]
                required: [state]
          then:
            properties: {workflow: {const: post_escalation_record}}
        - if:
            properties:
              retained_safety_action:
                type: object
                properties: {tier: {const: R0}}
                required: [tier]
            required: [retained_safety_action]
          then:
            properties:
              allowed_actions:
                contains: {const: get_emergency_help}
                minContains: 1
        - if:
            properties:
              retained_safety_action:
                type: object
                properties: {tier: {const: R1}}
                required: [tier]
            required: [retained_safety_action]
          then:
            properties:
              allowed_actions:
                contains: {const: get_professional_help}
                minContains: 1
        - if:
            properties:
              retained_safety_action:
                type: object
                properties: {tier: {const: R2}}
                required: [tier]
            required: [retained_safety_action]
          then:
            properties:
              allowed_actions:
                contains: {const: get_professional_help}
                minContains: 1
        - if:
            properties: {state: {const: failed}}
            required: [state]
          then:
            required: [latest_turn_id]
            properties:
              latest_turn_id:
                type: string
                format: uuid
              allowed_actions:
                type: array
                minItems: 1
                items: {enum: [submit_turn, retry, save_unconfirmed_draft, close_session, get_professional_help, get_emergency_help]}
        - if:
            properties: {state: {const: expired}}
            required: [state]
          then:
            properties:
              latest_turn_id: {type: 'null'}
              allowed_actions:
                type: array
                minItems: 1
                maxItems: 1
                items: {const: close_session}
            not:
              required: [retained_safety_action]

    CreateAgentTurnRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, input]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        input:
          $ref: ./agent-turn.schema.json#/$defs/UserTurnInput

    ReviseAssessmentDraftRequest:
      type: object
      additionalProperties: false
      required: [source_turn_id, expected_revision, expected_draft_digest, edit_reason, revised_draft]
      properties:
        source_turn_id:
          type: string
          format: uuid
          description: 必须是同一 Session 当前 latest draft_ready Turn。
        expected_revision: {type: integer, minimum: 1}
        expected_draft_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        edit_reason: {type: string, const: user_correction}
        revised_draft:
          $ref: ./agent-turn.schema.json#/$defs/AssessmentDraft

    RetryAssessmentTurnRequest:
      type: object
      additionalProperties: false
      required: [failed_turn_id, expected_revision]
      properties:
        failed_turn_id:
          type: string
          format: uuid
          description: 必须是同一 Session 当前 latest failed Turn。
        expected_revision: {type: integer, minimum: 1}

    CreateConfirmationIntentRequest:
      type: object
      additionalProperties: false
      required:
        - turn_id
        - expected_revision
        - decision
        - reviewed_fields
        - draft_digest
        - episode_selection
      properties:
        turn_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          minimum: 1
        decision:
          type: string
          const: confirm_facts
        reviewed_fields:
          type: array
          minItems: 8
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
              - locations
              - sensations
              - temporal
              - trend
              - aggravating_factors
              - relieving_factors
              - functional_impacts
              - background_facts
          description: 必须恰好包含当前 AssessmentDraft 的八个持久化事实组；空数组字段也必须在确认页显示并由用户复核。
        draft_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        episode_selection:
          $ref: '#/components/schemas/EpisodeSelection'

    EpisodeSelection:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [create_new, join_existing, reopen_existing]
          description: 用户明确选择新建、加入当前开放问题，或重新打开已解决/关闭的问题。
        episode_id:
          type: [string, 'null']
          format: uuid
        expected_revision:
          type: [integer, 'null']
          minimum: 1
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: 仅 create_new 使用的用户中性显示名；不得包含诊断或组织推断。
        started_on:
          type: [string, 'null']
          format: date
          description: 仅 create_new 使用的用户提供开始日期；不得由服务端当前日期或 Agent 推断。
      allOf:
        - if:
            properties: {mode: {const: create_new}}
            required: [mode]
          then:
            properties:
              episode_id: {type: 'null'}
              expected_revision: {type: 'null'}
              started_on: {type: string, format: date}
            not:
              anyOf:
                - required: [episode_id]
                - required: [expected_revision]
            required: [started_on]
        - if:
            properties: {mode: {enum: [join_existing, reopen_existing]}}
            required: [mode]
          then:
            required: [episode_id, expected_revision]
            properties:
              episode_id: {type: string, format: uuid}
              expected_revision: {type: integer, minimum: 1}
            not:
              anyOf:
                - required: [title]
                - required: [started_on]

    StartEscalationRecordReviewRequest:
      type: object
      additionalProperties: false
      required: [escalated_turn_id, expected_revision, decision]
      properties:
        escalated_turn_id:
          type: string
          format: uuid
          description: 必须是同一 Session 当前 latest escalated Turn。
        expected_revision:
          type: integer
          minimum: 1
        decision:
          type: string
          const: review_facts_after_safety_message

    ReviseEscalationRecordDraftRequest:
      type: object
      additionalProperties: false
      required: [source_turn_id, expected_revision, expected_draft_digest, edit_reason, revised_draft]
      properties:
        source_turn_id:
          type: string
          format: uuid
          description: 必须是同 Session 当前 latest draft_ready Turn。
        expected_revision:
          type: integer
          minimum: 1
        expected_draft_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        edit_reason:
          type: string
          const: user_correction
        revised_draft:
          $ref: ./agent-turn.schema.json#/$defs/AssessmentDraft

    DraftRevisionResult:
      type: object
      additionalProperties: false
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties: {workflow: {const: assessment}, state: {const: awaiting_confirmation}}
              required: [workflow, state, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                workflow: {const: assessment}
                status: {const: draft_ready}
                state: {const: awaiting_confirmation}
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: draft_revised}}
                      required: [event]
              required: [workflow, status, state, input]

    DraftRevisionEscalationResult:
      type: object
      additionalProperties: false
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties: {workflow: {const: assessment}, state: {const: escalated}}
              required: [workflow, state, retained_safety_action, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                workflow: {const: assessment}
                status: {const: escalated}
                state: {const: escalated}
                deterministic_safety_gate:
                  type: object
                  properties: {tier: {enum: [R0, R1]}}
                  required: [tier]
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: draft_revision_escalated}}
                      required: [event]
              required: [workflow, status, state, input, deterministic_safety_gate]

    DraftRevisionSafetyQuestionsResult:
      type: object
      additionalProperties: false
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties: {workflow: {const: assessment}, state: {const: awaiting_user}}
              required: [workflow, state, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                workflow: {const: assessment}
                status: {const: awaiting_user}
                state: {const: awaiting_user}
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: draft_revision_safety_recheck_required}}
                      required: [event]
              required: [workflow, status, state, input]

    DraftRevisionSafetyFailureResult:
      type: object
      additionalProperties: false
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties: {workflow: {const: assessment}, state: {const: failed}}
              required: [workflow, state, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                workflow: {const: assessment}
                status: {const: failed}
                state: {const: failed}
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: draft_revision_safety_recheck_failed}}
                      required: [event]
              required: [workflow, status, state, input]

    ReviseAssessmentDraftResult:
      oneOf:
        - $ref: '#/components/schemas/DraftRevisionResult'
        - $ref: '#/components/schemas/DraftRevisionEscalationResult'
        - $ref: '#/components/schemas/DraftRevisionSafetyQuestionsResult'
        - $ref: '#/components/schemas/DraftRevisionSafetyFailureResult'

    RetryTurnResult:
      type: object
      additionalProperties: false
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties: {state: {const: collecting}}
              required: [state, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                status: {const: queued}
                state: {const: collecting}
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: turn_retry_started}}
                      required: [event]
              required: [status, state, input]
      allOf:
        - if:
            properties:
              latest_turn:
                type: object
                properties: {workflow: {const: post_escalation_record}}
                required: [workflow]
            required: [latest_turn]
          then:
            properties:
              session:
                allOf:
                  - $ref: '#/components/schemas/AssessmentSession'
                  - type: object
                    properties: {workflow: {const: post_escalation_record}}
                    required: [workflow, retained_safety_action]
          else:
            properties:
              session:
                allOf:
                  - $ref: '#/components/schemas/AssessmentSession'
                  - type: object
                    properties: {workflow: {const: assessment}}
                    required: [workflow]

    ApprovalIntent:
      type: object
      additionalProperties: false
      required:
        - approval_id
        - source_session_id
        - target_ref
        - action_type
        - redacted
        - intent_digest
        - resource_revision
        - revision
        - status
        - created_at
        - expires_at
      properties:
        approval_id:
          type: string
          format: uuid
        source_session_id:
          type: [string, 'null']
          format: uuid
          description: 由 AssessmentSession 发起时为该 Session；非 Agent 审批为 null。
        target_ref:
          $ref: '#/components/schemas/ResourceRef'
        action_type:
          type: string
          enum: [confirm_body_signal_event, share_report]
        redacted:
          type: boolean
          description: true 表示只剩不含身体事实正文的最小审计墓碑。
        display_summary:
          type: string
          minLength: 1
          maxLength: 2000
        tombstone_reason:
          type: string
          enum: [user_discarded, session_expired, consent_revoked, retention_expired, execution_failed]
        intent_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        resource_revision:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
          description: Approval 自身并发版本；从 1 开始，每次持久化状态变化（含终态墓碑化）严格递增 1，不等于 resource_revision。
        status:
          type: string
          enum: [pending, approved, executing, executed, denied, expired, invalidated, failed]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties: {action_type: {const: confirm_body_signal_event}}
            required: [action_type]
          then:
            properties:
              source_session_id:
                type: string
                format: uuid
              target_ref:
                type: object
                properties: {type: {const: session}}
                required: [type]
        - if:
            properties: {action_type: {const: share_report}}
            required: [action_type]
          then:
            properties:
              source_session_id: {type: 'null'}
              target_ref:
                type: object
                properties: {type: {const: report}}
                required: [type]
        - if:
            properties: {redacted: {const: true}}
            required: [redacted]
          then:
            required: [tombstone_reason]
            not:
              required: [display_summary]
          else:
            required: [display_summary]
            not:
              required: [tombstone_reason]
        - if:
            properties: {status: {enum: [pending, approved, executing]}}
            required: [status]
          then:
            properties: {redacted: {const: false}}
        - if:
            properties: {status: {const: expired}}
            required: [status]
          then:
            properties: {redacted: {const: true}}

    ConfirmationIntentResult:
      type: object
      additionalProperties: false
      required: [approval, session, latest_turn]
      properties:
        approval:
          allOf:
            - $ref: '#/components/schemas/ApprovalIntent'
            - type: object
              properties:
                status: {const: pending}
                revision: {const: 1}
                action_type: {const: confirm_body_signal_event}
                source_session_id: {type: string, format: uuid}
                target_ref:
                  type: object
                  properties: {type: {const: session}}
                  required: [type]
              required: [status, revision, action_type, source_session_id, target_ref]
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties:
                state: {const: awaiting_approval}
                latest_turn_id: {type: string, format: uuid}
              required: [state, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                status: {const: approval_required}
                state: {const: awaiting_approval}
                output:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/ApprovalRequiredOutput
                    - type: object
                      properties: {approval_revision: {const: 1}}
                      required: [approval_revision]
              required: [status, state, output]
      allOf:
        - if:
            properties:
              latest_turn:
                type: object
                properties: {workflow: {const: post_escalation_record}}
                required: [workflow]
            required: [latest_turn]
          then:
            properties:
              session:
                allOf:
                  - $ref: '#/components/schemas/AssessmentSession'
                  - type: object
                    properties: {workflow: {const: post_escalation_record}}
                    required: [workflow, retained_safety_action]
          else:
            properties:
              session:
                allOf:
                  - $ref: '#/components/schemas/AssessmentSession'
                  - type: object
                    properties: {workflow: {const: assessment}}
                    required: [workflow]

    EscalationRecordReviewResult:
      type: object
      additionalProperties: false
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties:
                workflow: {const: post_escalation_record}
                state: {const: awaiting_confirmation}
              required: [workflow, state, retained_safety_action, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                workflow: {const: post_escalation_record}
                status: {const: draft_ready}
                state: {const: awaiting_confirmation}
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {enum: [escalation_record_review_started, escalation_record_draft_revised]}}
                      required: [event]
              required: [workflow, status, state, input]

    StartEscalationRecordReviewResult:
      allOf:
        - $ref: '#/components/schemas/EscalationRecordReviewResult'
        - type: object
          properties:
            latest_turn:
              type: object
              properties:
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: escalation_record_review_started}}
                      required: [event]
              required: [input]
          required: [latest_turn]

    EscalationRecordDraftRevisedResult:
      allOf:
        - $ref: '#/components/schemas/EscalationRecordReviewResult'
        - type: object
          properties:
            latest_turn:
              type: object
              properties:
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: escalation_record_draft_revised}}
                      required: [event]
              required: [input]
          required: [latest_turn]

    EscalationRecordRestartResult:
      type: object
      additionalProperties: false
      description: R1 修正明确命中 R0；post 草稿与未执行 Intent 失效，并重新优先展示升级行动。
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties:
                workflow: {const: assessment}
                state: {const: escalated}
                retained_safety_action:
                  type: object
                  properties: {tier: {const: R0}}
                  required: [tier]
              required: [workflow, state, retained_safety_action, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                workflow: {const: assessment}
                status: {const: escalated}
                state: {const: escalated}
                deterministic_safety_gate:
                  type: object
                  properties: {tier: {const: R0}}
                  required: [tier]
                safety_envelope:
                  type: object
                  properties: {mode: {const: emergency}}
                  required: [mode]
                output:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/EscalationOutput
                    - type: object
                      properties: {tier: {const: R0}}
                      required: [tier]
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: escalation_record_draft_escalated}}
                      required: [event]
              required: [workflow, status, state, input, deterministic_safety_gate, safety_envelope, output]

    EscalationRecordSafetyQuestionsResult:
      type: object
      additionalProperties: false
      description: 修正后安全信息不完整；保留原 R0/R1 行动层，只追问经审阅的最少安全问题。
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties: {workflow: {const: post_escalation_record}, state: {const: awaiting_user}}
              required: [workflow, state, retained_safety_action, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                workflow: {const: post_escalation_record}
                status: {const: awaiting_user}
                state: {const: awaiting_user}
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: escalation_record_safety_recheck_required}}
                      required: [event]
              required: [workflow, status, state, input]

    EscalationRecordSafetyFailureResult:
      type: object
      additionalProperties: false
      description: 确定性安全重检不可用；不保存修订，保留原 R0/R1 行动层并显示降级状态。
      required: [session, latest_turn]
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: object
              properties: {workflow: {const: post_escalation_record}, state: {const: failed}}
              required: [workflow, state, retained_safety_action, latest_turn_id]
        latest_turn:
          allOf:
            - $ref: ./agent-turn.schema.json
            - type: object
              properties:
                workflow: {const: post_escalation_record}
                status: {const: failed}
                state: {const: failed}
                input:
                  allOf:
                    - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                    - type: object
                      properties: {event: {const: escalation_record_safety_recheck_failed}}
                      required: [event]
              required: [workflow, status, state, input]

    ReviseEscalationRecordDraftResult:
      oneOf:
        - $ref: '#/components/schemas/EscalationRecordDraftRevisedResult'
        - $ref: '#/components/schemas/EscalationRecordRestartResult'
        - $ref: '#/components/schemas/EscalationRecordSafetyQuestionsResult'
        - $ref: '#/components/schemas/EscalationRecordSafetyFailureResult'

    ReportShareIntentResult:
      type: object
      additionalProperties: false
      required: [approval]
      properties:
        approval:
          allOf:
            - $ref: '#/components/schemas/ApprovalIntent'
            - type: object
              properties:
                status: {const: pending}
                revision: {const: 1}
                action_type: {const: share_report}
                source_session_id: {type: 'null'}
                target_ref:
                  type: object
                  properties: {type: {const: report}}
                  required: [type]
              required: [status, revision, action_type, source_session_id, target_ref]

    ApprovalRecoveryResult:
      type: object
      additionalProperties: false
      required: [approval, decision_result]
      properties:
        approval:
          $ref: '#/components/schemas/ApprovalIntent'
        decision_result:
          oneOf:
            - $ref: '#/components/schemas/ApprovalDecisionResult'
            - type: 'null'
      allOf:
        - if:
            allOf:
              - properties:
                  approval:
                    type: object
                    properties: {redacted: {const: false}}
                    required: [redacted]
                required: [approval]
              - properties:
                  approval:
                    type: object
                    properties: {status: {enum: [executed, denied, invalidated, failed]}}
                    required: [status]
                required: [approval]
          then:
            properties:
              decision_result:
                $ref: '#/components/schemas/ApprovalDecisionResult'
          else:
            properties:
              decision_result: {type: 'null'}

    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, intent_digest, expected_revision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
        intent_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        expected_revision:
          type: integer
          minimum: 1
          description: 当前 Approval revision；精确幂等重放先返回原结果，否则不匹配即拒绝。

    ApprovalDecisionResult:
      type: object
      additionalProperties: false
      required: [approval_id, action_type, target_ref, source_session_id, status, resolution_reason, revision, result_refs, session_snapshot, latest_turn, decided_at]
      properties:
        approval_id:
          type: string
          format: uuid
        action_type:
          type: string
          enum: [confirm_body_signal_event, share_report]
        target_ref:
          $ref: '#/components/schemas/ResourceRef'
        source_session_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [executed, denied, invalidated, failed]
        resolution_reason:
          type: string
          enum: [action_executed, user_denied, context_changed, user_discarded, session_expired, consent_revoked, execution_failed]
        revision:
          type: integer
          minimum: 1
          description: 动作收敛后的 Approval 当前 revision；approve 成功或执行失败通常为请求 N+3，deny/直接 invalidated 为 N+1。
        result_refs:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceRef'
        session_snapshot:
          oneOf:
            - $ref: '#/components/schemas/AssessmentSession'
            - type: 'null'
        latest_turn:
          oneOf:
            - $ref: ./agent-turn.schema.json
            - type: 'null'
        decided_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties: {source_session_id: {type: string}}
            required: [source_session_id]
          then:
            properties:
              session_snapshot:
                $ref: '#/components/schemas/AssessmentSession'
          else:
            properties:
              session_snapshot: {type: 'null'}
              latest_turn: {type: 'null'}
        - if:
            properties: {status: {const: executed}}
            required: [status]
          then:
            properties:
              resolution_reason: {const: action_executed}
              result_refs:
                type: array
                minItems: 1
        - if:
            properties: {status: {const: denied}}
            required: [status]
          then:
            properties: {resolution_reason: {const: user_denied}}
        - if:
            properties: {status: {const: invalidated}}
            required: [status]
          then:
            properties:
              resolution_reason: {enum: [context_changed, user_discarded, session_expired, consent_revoked]}
        - if:
            properties: {status: {const: failed}}
            required: [status]
          then:
            properties: {resolution_reason: {const: execution_failed}}
        - if:
            allOf:
              - properties: {source_session_id: {type: string}}
                required: [source_session_id]
              - properties: {status: {const: executed}}
                required: [status]
          then:
            properties:
              session_snapshot:
                allOf:
                  - $ref: '#/components/schemas/AssessmentSession'
                  - type: object
                    properties: {state: {const: completed}}
                    required: [state]
              latest_turn:
                allOf:
                  - $ref: ./agent-turn.schema.json
                  - type: object
                    properties:
                      status: {const: completed}
                      state: {const: completed}
                    required: [status, state]
        - if:
            allOf:
              - properties: {source_session_id: {type: string}}
                required: [source_session_id]
              - properties: {status: {const: denied}}
                required: [status]
          then:
            properties:
              latest_turn:
                allOf:
                  - $ref: ./agent-turn.schema.json
                  - type: object
                    properties:
                      input:
                        allOf:
                          - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                          - type: object
                            properties:
                              event: {const: approval_decided}
                              approval_status: {const: denied}
                            required: [event, approval_status]
                    required: [input]
        - if:
            allOf:
              - properties: {source_session_id: {type: string}}
                required: [source_session_id]
              - properties: {status: {const: invalidated}}
                required: [status]
              - properties: {resolution_reason: {const: context_changed}}
                required: [resolution_reason]
          then:
            properties:
              latest_turn:
                allOf:
                  - $ref: ./agent-turn.schema.json
                  - type: object
                    properties:
                      input:
                        allOf:
                          - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                          - type: object
                            properties:
                              event: {const: approval_decided}
                              approval_status: {const: invalidated}
                            required: [event, approval_status]
                    required: [input]
        - if:
            allOf:
              - properties: {source_session_id: {type: string}}
                required: [source_session_id]
              - properties: {status: {const: failed}}
                required: [status]
          then:
            properties:
              latest_turn:
                allOf:
                  - $ref: ./agent-turn.schema.json
                  - type: object
                    properties:
                      input:
                        allOf:
                          - $ref: ./agent-turn.schema.json#/$defs/LifecycleTurnInput
                          - type: object
                            properties:
                              event: {const: approval_decided}
                              approval_status: {const: failed}
                            required: [event, approval_status]
                    required: [input]
        - if:
            allOf:
              - properties: {source_session_id: {type: string}}
                required: [source_session_id]
              - properties: {status: {const: denied}}
                required: [status]
          then:
            properties:
              session_snapshot:
                allOf:
                  - $ref: '#/components/schemas/AssessmentSession'
                  - type: object
                    properties: {state: {const: awaiting_confirmation}}
                    required: [state]
              latest_turn:
                allOf:
                  - $ref: ./agent-turn.schema.json
                  - type: object
                    properties:
                      status: {const: draft_ready}
                      state: {const: awaiting_confirmation}
                    required: [status, state]
        - if:
            allOf:
              - properties: {source_session_id: {type: string}}
                required: [source_session_id]
              - properties: {status: {const: invalidated}}
                required: [status]
          then:
            oneOf:
              - properties:
                  resolution_reason: {const: context_changed}
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: awaiting_confirmation}}
                        required: [state]
                  latest_turn:
                    allOf:
                      - $ref: ./agent-turn.schema.json
                      - type: object
                        properties: {status: {const: draft_ready}, state: {const: awaiting_confirmation}}
                        required: [status, state]
              - properties:
                  resolution_reason: {const: context_changed}
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: safety_review}}
                        required: [state]
                  latest_turn:
                    allOf:
                      - $ref: ./agent-turn.schema.json
                      - type: object
                        properties: {status: {const: running}, state: {const: safety_review}}
                        required: [status, state]
              - properties:
                  resolution_reason: {const: context_changed}
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: escalated}}
                        required: [state, retained_safety_action]
                  latest_turn:
                    allOf:
                      - $ref: ./agent-turn.schema.json
                      - type: object
                        properties: {workflow: {const: assessment}, status: {const: escalated}, state: {const: escalated}}
                        required: [workflow, status, state]
              - properties:
                  resolution_reason: {const: context_changed}
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: failed}}
                        required: [state]
                  latest_turn:
                    allOf:
                      - $ref: ./agent-turn.schema.json
                      - type: object
                        properties: {status: {const: failed}, state: {const: failed}}
                        required: [status, state]
              - properties:
                  resolution_reason: {enum: [user_discarded, session_expired, consent_revoked]}
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: expired}, latest_turn_id: {type: 'null'}}
                        required: [state, latest_turn_id]
                  latest_turn: {type: 'null'}
        - if:
            allOf:
              - properties: {source_session_id: {type: string}}
                required: [source_session_id]
              - properties: {status: {const: failed}}
                required: [status]
          then:
            oneOf:
              - properties:
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: awaiting_confirmation}}
                        required: [state]
                  latest_turn:
                    allOf:
                      - $ref: ./agent-turn.schema.json
                      - type: object
                        properties: {status: {const: draft_ready}, state: {const: awaiting_confirmation}}
                        required: [status, state]
              - properties:
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: safety_review}}
                        required: [state]
                  latest_turn:
                    allOf:
                      - $ref: ./agent-turn.schema.json
                      - type: object
                        properties: {status: {const: running}, state: {const: safety_review}}
                        required: [status, state]
              - properties:
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: escalated}}
                        required: [state, retained_safety_action]
                  latest_turn:
                    allOf:
                      - $ref: ./agent-turn.schema.json
                      - type: object
                        properties: {workflow: {const: assessment}, status: {const: escalated}, state: {const: escalated}}
                        required: [workflow, status, state]
              - properties:
                  session_snapshot:
                    allOf:
                      - $ref: '#/components/schemas/AssessmentSession'
                      - type: object
                        properties: {state: {const: failed}}
                        required: [state]
                  latest_turn:
                    allOf:
                      - $ref: ./agent-turn.schema.json
                      - type: object
                        properties: {status: {const: failed}, state: {const: failed}}
                        required: [status, state]
        - if:
            properties: {status: {enum: [denied, invalidated, failed]}}
            required: [status]
          then:
            properties:
              result_refs:
                type: array
                maxItems: 0
        - if:
            properties: {action_type: {const: confirm_body_signal_event}}
            required: [action_type]
          then:
            properties:
              source_session_id: {type: string, format: uuid}
              target_ref:
                type: object
                properties: {type: {const: session}}
                required: [type]
        - if:
            properties: {action_type: {const: share_report}}
            required: [action_type]
          then:
            properties:
              source_session_id: {type: 'null'}
              target_ref:
                type: object
                properties: {type: {const: report}}
                required: [type]
        - if:
            allOf:
              - properties: {status: {const: executed}}
                required: [status]
              - properties: {action_type: {const: confirm_body_signal_event}}
                required: [action_type]
          then:
            properties:
              result_refs:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  allOf:
                    - $ref: '#/components/schemas/ResourceRef'
                    - type: object
                      properties: {type: {const: event}}
                      required: [type]
                contains:
                  type: object
                  properties: {type: {const: event}}
                  required: [type]
                minContains: 1
        - if:
            allOf:
              - properties: {status: {const: executed}}
                required: [status]
              - properties: {action_type: {const: share_report}}
                required: [action_type]
          then:
            properties:
              result_refs:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  allOf:
                    - $ref: '#/components/schemas/ResourceRef'
                    - type: object
                      properties: {type: {const: report_share}}
                      required: [type]
                contains:
                  type: object
                  properties: {type: {const: report_share}}
                  required: [type]
                minContains: 1

    ResourceRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [event, episode, report, report_share, reminder, approval, session]
        id:
          type: string
          format: uuid

    EpisodeList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    EpisodeSummary:
      type: object
      additionalProperties: false
      required: [episode_id, title, primary_region_id, status, started_on, revision, last_check_in_at, updated_at]
      properties:
        episode_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        primary_region_id:
          type: string
          pattern: '^body\.[a-z0-9_]+(?:\.[a-z0-9_]+)+$'
        status:
          type: string
          enum: [open, monitoring, resolved, closed]
        started_on:
          type: string
          format: date
          description: 用户确认的首次出现日期；可由近似日期规范化，但不得由 AI 臆测。
        revision:
          type: integer
          minimum: 1
        latest_event_id:
          type: [string, 'null']
          format: uuid
        recurrence_of_episode_id:
          type: [string, 'null']
          format: uuid
        next_check_in_at:
          type: [string, 'null']
          format: date-time
        last_check_in_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: string
          format: date-time

    EpisodeDetail:
      type: object
      additionalProperties: false
      required:
        - episode_id
        - title
        - primary_region_id
        - status
        - started_on
        - revision
        - last_check_in_at
        - event_refs
        - page
        - created_at
        - updated_at
      properties:
        episode_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        primary_region_id:
          type: string
          pattern: '^body\.[a-z0-9_]+(?:\.[a-z0-9_]+)+$'
        status:
          type: string
          enum: [open, monitoring, resolved, closed]
        started_on:
          type: string
          format: date
        revision:
          type: integer
          minimum: 1
        latest_event_id:
          type: [string, 'null']
          format: uuid
        recurrence_of_episode_id:
          type: [string, 'null']
          format: uuid
        next_check_in_at:
          type: [string, 'null']
          format: date-time
        last_check_in_at:
          type: [string, 'null']
          format: date-time
        event_refs:
          type: array
          items:
            $ref: '#/components/schemas/EventRef'
        page:
          $ref: '#/components/schemas/PageInfo'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventRef:
      type: object
      additionalProperties: false
      required: [event_id, lifecycle, resource_revision, correction_sequence, content_digest, occurred_at, recorded_at]
      properties:
        event_id:
          type: string
          format: uuid
        lifecycle:
          type: string
          enum: [confirmed, superseded, voided]
        resource_revision:
          type: integer
          minimum: 1
        correction_sequence:
          type: integer
          minimum: 1
        content_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        occurred_at:
          $ref: ./body-signal-event.schema.json#/$defs/ApproximateDateTime
        recorded_at:
          type: string
          format: date-time

    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        has_more:
          type: boolean

    CreateCheckInRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, locale, timezone, client_context]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        locale:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        client_context:
          $ref: '#/components/schemas/ClientContext'

    StartEventRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_resource_revision, locale, timezone, client_context]
      properties:
        expected_resource_revision:
          type: integer
          minimum: 1
          description: 来源 Event 当前 resource_revision；若同时使用 If-Match，两者必须一致。
        locale:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        client_context:
          $ref: '#/components/schemas/ClientContext'

    UpdateEpisodeStatusRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, next_status, user_action]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        next_status:
          type: string
          enum: [open, monitoring, resolved, closed]
        user_action:
          type: string
          enum: [start_monitoring, mark_resolved, close_episode, reopen_episode]
        note:
          type: string
          maxLength: 500
      allOf:
        - if:
            properties: {user_action: {const: start_monitoring}}
            required: [user_action]
          then:
            properties: {next_status: {const: monitoring}}
        - if:
            properties: {user_action: {const: mark_resolved}}
            required: [user_action]
          then:
            properties: {next_status: {const: resolved}}
        - if:
            properties: {user_action: {const: close_episode}}
            required: [user_action]
          then:
            properties: {next_status: {const: closed}}
        - if:
            properties: {user_action: {const: reopen_episode}}
            required: [user_action]
          then:
            properties: {next_status: {const: open}}

    SetCheckInReminderRequest:
      type: object
      additionalProperties: false
      required: [expected_episode_revision, expected_reminder_revision, schedule, generic_notification_only]
      properties:
        expected_episode_revision:
          type: integer
          minimum: 1
        expected_reminder_revision:
          type: [integer, 'null']
          minimum: 1
        schedule:
          $ref: '#/components/schemas/ReminderSchedule'
        generic_notification_only:
          type: boolean
          const: true

    ReminderSchedule:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, fire_at, timezone]
          properties:
            kind:
              type: string
              const: once
            fire_at:
              type: string
              format: date-time
            timezone:
              type: string
              minLength: 1
              maxLength: 64
        - type: object
          additionalProperties: false
          required: [kind, local_time, timezone]
          properties:
            kind:
              type: string
              const: daily
            local_time:
              type: string
              pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
            timezone:
              type: string
              minLength: 1
              maxLength: 64
        - type: object
          additionalProperties: false
          required: [kind, interval_days, local_time, timezone]
          properties:
            kind:
              type: string
              const: interval_days
            interval_days:
              type: integer
              minimum: 1
              maximum: 90
            local_time:
              type: string
              pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
            timezone:
              type: string
              minLength: 1
              maxLength: 64

    CheckInReminder:
      type: object
      additionalProperties: false
      required: [reminder_id, episode_id, status, schedule, revision, next_fire_at, created_at, updated_at]
      properties:
        reminder_id:
          type: string
          format: uuid
        episode_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [scheduled, disabled, completed]
        schedule:
          $ref: '#/components/schemas/ReminderSchedule'
        revision:
          type: integer
          minimum: 1
        next_fire_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties: {status: {const: scheduled}}
            required: [status]
          then:
            properties:
              next_fire_at:
                type: string
                format: date-time
        - if:
            properties: {status: {enum: [disabled, completed]}}
            required: [status]
          then:
            properties:
              next_fire_at: {type: 'null'}
        - if:
            properties: {status: {const: completed}}
            required: [status]
          then:
            properties:
              schedule:
                type: object
                properties: {kind: {const: once}}
                required: [kind]

    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [episode_id, event_ids, report_type, locale]
      properties:
        episode_id:
          type: string
          format: uuid
        event_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        report_type:
          type: string
          enum: [user_summary, professional_summary]
        locale:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'

    ReportSnapshot:
      type: object
      additionalProperties: false
      required:
        - report_id
        - episode_id
        - version
        - report_type
        - locale
        - event_ids
        - safety_as_of_event_id
        - source_selection_digest
        - status
        - sections
        - body_map_snapshot
        - artifacts
        - versions
        - safetyBaselineId
        - created_at
      properties:
        report_id:
          type: string
          format: uuid
        episode_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        report_type:
          type: string
          enum: [user_summary, professional_summary]
        locale:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
        event_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        safety_as_of_event_id:
          type: string
          format: uuid
          description: 服务端从所选 Event 中确定的安全摘要截止事件；必须属于 event_ids。
        source_selection_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: 绑定 episode、Event IDs/revisions/digests、locale 和 report_type 的规范化摘要。
        status:
          type: string
          const: ready
        sections:
          type: array
          minItems: 8
          maxItems: 8
          prefixItems:
            - $ref: '#/components/schemas/ReportScopeSection'
            - $ref: '#/components/schemas/ReportBodyLocationsSection'
            - $ref: '#/components/schemas/ReportConfirmedSignalsSection'
            - $ref: '#/components/schemas/ReportTrendSection'
            - $ref: '#/components/schemas/ReportSafetySummarySection'
            - $ref: '#/components/schemas/ReportGuidanceSection'
            - $ref: '#/components/schemas/ReportUnansweredSection'
            - $ref: '#/components/schemas/ReportSourcesConsentsDisclosuresSection'
          items: false
        body_map_snapshot:
          $ref: '#/components/schemas/ReportBodyMapSnapshot'
        artifacts:
          type: array
          minItems: 3
          maxItems: 10
          items:
            $ref: '#/components/schemas/ReportArtifact'
          allOf:
            - contains:
                type: object
                properties: {role: {const: printable_pdf}}
                required: [role]
            - contains:
                type: object
                properties: {role: {const: structured_json}}
                required: [role]
            - contains:
                type: object
                properties: {role: {const: body_map_2d}}
                required: [role]
        versions:
          $ref: '#/components/schemas/ReportVersions'
        safetyBaselineId:
          type: string
          minLength: 1
          pattern: '^[A-Za-z0-9._:-]{1,120}$'
          maxLength: 120
        created_at:
          type: string
          format: date-time
        supersedes_report_id:
          type: [string, 'null']
          format: uuid

    ReportList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    ReportSummary:
      type: object
      additionalProperties: false
      required: [report_id, episode_id, version, report_type, status, event_count, created_at]
      properties:
        report_id:
          type: string
          format: uuid
        episode_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        report_type:
          type: string
          enum: [user_summary, professional_summary]
        status:
          type: string
          const: ready
        event_count:
          type: integer
          minimum: 1
        supersedes_report_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time

    ReportBodyMapSnapshot:
      type: object
      additionalProperties: false
      required: [artifact_id, projections, marker_ids, alt_text, content_digest]
      properties:
        artifact_id:
          type: string
          format: uuid
        projections:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [anterior, posterior, left_lateral, right_lateral]
          allOf:
            - contains: {const: anterior}
            - contains: {const: posterior}
        marker_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        alt_text:
          type: string
          minLength: 1
          maxLength: 2000
        content_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'

    ReportArtifact:
      type: object
      additionalProperties: false
      required: [artifact_id, role, media_type, byte_size, content_digest]
      properties:
        artifact_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [printable_pdf, structured_json, body_map_2d]
        media_type:
          type: string
          enum: [application/pdf, application/json, image/png, image/svg+xml]
        byte_size:
          type: integer
          minimum: 1
        content_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        schema_id:
          type: string
          format: uri
          maxLength: 500
        schema_version:
          type: string
          const: '1.0'
      allOf:
        - if:
            properties: {role: {const: printable_pdf}}
            required: [role]
          then:
            properties: {media_type: {const: application/pdf}}
            not:
              anyOf:
                - required: [schema_id]
                - required: [schema_version]
        - if:
            properties: {role: {const: structured_json}}
            required: [role]
          then:
            required: [schema_id, schema_version]
            properties:
              media_type: {const: application/json}
        - if:
            properties: {role: {const: body_map_2d}}
            required: [role]
          then:
            properties: {media_type: {enum: [image/png, image/svg+xml]}}
            not:
              anyOf:
                - required: [schema_id]
                - required: [schema_version]

    ReportArtifactDownload:
      type: object
      additionalProperties: false
      required: [artifact, download_url, expires_at]
      properties:
        artifact:
          $ref: '#/components/schemas/ReportArtifact'
        download_url:
          type: string
          format: uri
          maxLength: 2000
        expires_at:
          type: string
          format: date-time

    ReportSection:
      oneOf:
        - $ref: '#/components/schemas/ReportScopeSection'
        - $ref: '#/components/schemas/ReportBodyLocationsSection'
        - $ref: '#/components/schemas/ReportConfirmedSignalsSection'
        - $ref: '#/components/schemas/ReportTrendSection'
        - $ref: '#/components/schemas/ReportSafetySummarySection'
        - $ref: '#/components/schemas/ReportGuidanceSection'
        - $ref: '#/components/schemas/ReportUnansweredSection'
        - $ref: '#/components/schemas/ReportSourcesConsentsDisclosuresSection'

    ReportReviewedContentRef:
      type: object
      additionalProperties: false
      required: [content_id, content_release_id, locale, rendered_text, rendered_text_digest]
      properties:
        content_id:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9._-]{2,159}$'
        content_release_id:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
        rendered_text:
          type: string
          minLength: 1
          maxLength: 4000
        rendered_text_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'

    ReportFactRef:
      type: object
      additionalProperties: false
      required: [event_id, event_correction_sequence, json_pointer, rendered_value, value_digest]
      properties:
        event_id:
          type: string
          format: uuid
        event_correction_sequence:
          type: integer
          minimum: 1
          description: Event 修订链中的 correction_sequence，不是资源 ETag/resource_revision。
        json_pointer:
          type: string
          pattern: '^/(?:[^~/]|~0|~1)+(?:/(?:[^~/]|~0|~1)+)*$'
        rendered_value:
          type: string
          minLength: 1
          maxLength: 4000
        value_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'

    ReportFactGroup:
      type: object
      additionalProperties: false
      required: [state, fact_refs, absence_reason]
      properties:
        state:
          type: string
          enum: [included, absent]
        fact_refs:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReportFactRef'
        absence_reason:
          type: [string, 'null']
          enum: [not_recorded, not_authorized, not_applicable, null]
      allOf:
        - if:
            properties: {state: {const: included}}
            required: [state]
          then:
            properties:
              fact_refs: {type: array, minItems: 1}
              absence_reason: {type: 'null'}
        - if:
            properties: {state: {const: absent}}
            required: [state]
          then:
            properties:
              fact_refs: {type: array, maxItems: 0}
              absence_reason:
                type: string
                enum: [not_recorded, not_authorized, not_applicable]

    ReportScopeSection:
      type: object
      additionalProperties: false
      required: [code, title_content, content]
      properties:
        code: {type: string, const: report_scope}
        title_content:
          $ref: '#/components/schemas/ReportReviewedContentRef'
        content:
          type: object
          additionalProperties: false
          required: [subject_kind, episode_id, event_ids, recorded_from, recorded_to, timezone]
          properties:
            subject_kind: {type: string, const: account_owner}
            episode_id: {type: string, format: uuid}
            event_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items: {type: string, format: uuid}
            recorded_from: {type: string, format: date-time}
            recorded_to: {type: string, format: date-time}
            timezone: {type: string, minLength: 1, maxLength: 64}

    ReportBodyLocationsSection:
      type: object
      additionalProperties: false
      required: [code, title_content, content]
      properties:
        code: {type: string, const: body_locations}
        title_content:
          $ref: '#/components/schemas/ReportReviewedContentRef'
        content:
          type: object
          additionalProperties: false
          required: [locations, marker_ids, body_map_artifact_id]
          properties:
            locations:
              type: array
              minItems: 1
              maxItems: 200
              items:
                $ref: ./body-location.schema.json
            marker_ids:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, format: uuid}
            body_map_artifact_id: {type: string, format: uuid}

    ReportConfirmedSignalsSection:
      type: object
      additionalProperties: false
      required: [code, title_content, content]
      properties:
        code: {type: string, const: confirmed_signals}
        title_content:
          $ref: '#/components/schemas/ReportReviewedContentRef'
        content:
          type: object
          additionalProperties: false
          required: [sensations, temporal, aggravating_factors, relieving_factors, functional_impacts, background_facts]
          properties:
            sensations: {$ref: '#/components/schemas/ReportFactGroup'}
            temporal: {$ref: '#/components/schemas/ReportFactGroup'}
            aggravating_factors: {$ref: '#/components/schemas/ReportFactGroup'}
            relieving_factors: {$ref: '#/components/schemas/ReportFactGroup'}
            functional_impacts: {$ref: '#/components/schemas/ReportFactGroup'}
            background_facts: {$ref: '#/components/schemas/ReportFactGroup'}

    ReportTrendComparison:
      type: object
      additionalProperties: false
      required: [from_event_id, to_event_id, fact_path, direction, comparison_digest]
      properties:
        from_event_id: {type: string, format: uuid}
        to_event_id: {type: string, format: uuid}
        fact_path: {type: string, pattern: '^/'}
        direction:
          type: string
          enum: [improving, stable, worsening, fluctuating, unknown]
        comparison_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}

    ReportTrendSection:
      type: object
      additionalProperties: false
      required: [code, title_content, content]
      properties:
        code: {type: string, const: trend_summary}
        title_content:
          $ref: '#/components/schemas/ReportReviewedContentRef'
        content:
          type: object
          additionalProperties: false
          required: [state, as_of_event_id, comparisons, section_statement]
          properties:
            state: {type: string, enum: [comparable, insufficient_data]}
            as_of_event_id: {type: string, format: uuid}
            comparisons:
              type: array
              maxItems: 200
              items: {$ref: '#/components/schemas/ReportTrendComparison'}
            section_statement: {$ref: '#/components/schemas/ReportReviewedContentRef'}
          allOf:
            - if:
                properties: {state: {const: comparable}}
                required: [state]
              then:
                properties: {comparisons: {type: array, minItems: 1}}
            - if:
                properties: {state: {const: insufficient_data}}
                required: [state]
              then:
                properties: {comparisons: {type: array, maxItems: 0}}

    ReportSafetySummarySection:
      type: object
      additionalProperties: false
      required: [code, title_content, content]
      properties:
        code: {type: string, const: safety_summary}
        title_content: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        content:
          $ref: '#/components/schemas/ReportSafetySummaryPayload'

    ReportSafetySummaryPayload:
      type: object
      additionalProperties: false
      required:
        - as_of_event_id
        - mode
        - status
        - tier
        - rule_outcome
        - triggered_rule_ids
        - unresolved_question_ids
        - unresolved_safety
        - required_action_code
        - user_explanation
        - required_action_content
        - ordinary_advice_suppressed
        - evaluated_at
        - safetyBaselineId
      properties:
        as_of_event_id: {type: string, format: uuid}
        mode: {type: string, enum: [emergency, urgent, normal, manual, unsupported, degraded]}
        status: {type: string, enum: [complete, incomplete, unavailable]}
        tier: {type: string, enum: [R0, R1, R2, R3, undetermined]}
        rule_outcome: {type: string, enum: [triggered, no_rule_triggered, unresolved, unavailable]}
        triggered_rule_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items: {type: string, pattern: '^[A-Za-z0-9._-]{1,120}$'}
        unresolved_question_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items: {type: string, pattern: '^[A-Za-z0-9._-]{1,120}$'}
        unresolved_safety: {type: boolean}
        required_action_code: {type: string, pattern: '^[A-Z0-9._-]{1,120}$'}
        user_explanation: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        required_action_content: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        ordinary_advice_suppressed: {type: boolean}
        evaluated_at: {type: string, format: date-time}
        safetyBaselineId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,120}$'
      allOf:
        - if:
            properties: {rule_outcome: {const: triggered}}
            required: [rule_outcome]
          then:
            properties:
              tier: {enum: [R0, R1, R2, R3]}
              triggered_rule_ids: {type: array, minItems: 1}
        - if:
            properties: {rule_outcome: {const: no_rule_triggered}}
            required: [rule_outcome]
          then:
            properties:
              status: {const: complete}
              tier: {const: R3}
              triggered_rule_ids: {type: array, maxItems: 0}
        - if:
            properties: {rule_outcome: {const: unresolved}}
            required: [rule_outcome]
          then:
            properties:
              status: {const: incomplete}
              tier: {const: undetermined}
              ordinary_advice_suppressed: {const: true}
        - if:
            properties: {rule_outcome: {const: unavailable}}
            required: [rule_outcome]
          then:
            properties:
              status: {const: unavailable}
              tier: {const: undetermined}
              ordinary_advice_suppressed: {const: true}
        - if:
            properties: {status: {enum: [incomplete, unavailable]}}
            required: [status]
          then:
            properties:
              unresolved_safety: {const: true}
              ordinary_advice_suppressed: {const: true}
        - if:
            properties: {status: {const: complete}}
            required: [status]
          then:
            properties: {unresolved_safety: {const: false}}
        - if:
            properties: {tier: {enum: [R0, R1, undetermined]}}
            required: [tier]
          then:
            properties: {ordinary_advice_suppressed: {const: true}}
        - if:
            properties: {tier: {const: R0}}
            required: [tier]
          then:
            properties: {mode: {const: emergency}}
        - if:
            properties: {tier: {const: R1}}
            required: [tier]
          then:
            properties: {mode: {const: urgent}}
        - if:
            properties: {mode: {const: emergency}}
            required: [mode]
          then:
            properties: {tier: {const: R0}}
        - if:
            properties: {mode: {const: urgent}}
            required: [mode]
          then:
            properties: {tier: {const: R1}}
        - if:
            properties: {mode: {const: normal}}
            required: [mode]
          then:
            properties:
              status: {const: complete}
              tier: {enum: [R2, R3]}
              ordinary_advice_suppressed: {const: false}
        - if:
            properties: {mode: {enum: [manual, unsupported, degraded]}}
            required: [mode]
          then:
            properties:
              tier: {enum: [R2, R3, undetermined]}
              ordinary_advice_suppressed: {const: true}

    ReportGuidanceSection:
      type: object
      additionalProperties: false
      required: [code, title_content, content]
      properties:
        code: {type: string, const: guidance_and_monitoring}
        title_content: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        content:
          type: object
          additionalProperties: false
          required: [tier, safety_status, action_contents, monitoring_contents, escalation_conditions, next_check_in_at, ordinary_advice_suppressed]
          properties:
            tier: {type: string, enum: [R0, R1, R2, R3, undetermined]}
            safety_status: {type: string, enum: [complete, incomplete, unavailable]}
            action_contents:
              type: array
              minItems: 1
              maxItems: 30
              items: {$ref: '#/components/schemas/ReportReviewedContentRef'}
            monitoring_contents:
              type: array
              maxItems: 30
              items: {$ref: '#/components/schemas/ReportReviewedContentRef'}
            escalation_conditions:
              type: array
              minItems: 1
              maxItems: 30
              items: {$ref: '#/components/schemas/ReportReviewedContentRef'}
            next_check_in_at: {type: [string, 'null'], format: date-time}
            ordinary_advice_suppressed: {type: boolean}
          allOf:
            - if:
                properties: {ordinary_advice_suppressed: {const: true}}
                required: [ordinary_advice_suppressed]
              then:
                properties:
                  monitoring_contents: {type: array, maxItems: 0}
                  next_check_in_at: {type: 'null'}
            - if:
                properties: {tier: {enum: [R0, R1, undetermined]}}
                required: [tier]
              then:
                properties: {ordinary_advice_suppressed: {const: true}}
            - if:
                properties: {safety_status: {enum: [incomplete, unavailable]}}
                required: [safety_status]
              then:
                properties: {ordinary_advice_suppressed: {const: true}}

    ReportUnansweredItem:
      type: object
      additionalProperties: false
      required: [item_id, category, answer_state, source_event_id, display_content]
      properties:
        item_id: {type: string, pattern: '^[A-Za-z0-9._-]{1,120}$'}
        category:
          type: string
          enum: [location, sensation, intensity, temporal, aggravating_factor, relieving_factor, functional_impact, background, safety_question]
        answer_state: {type: string, enum: [not_answered, uncertain, unknown, not_collected]}
        source_event_id: {type: string, format: uuid}
        question_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,120}$'
        display_content: {$ref: '#/components/schemas/ReportReviewedContentRef'}
      allOf:
        - if:
            properties: {category: {const: safety_question}}
            required: [category]
          then:
            required: [question_id]
        - if:
            properties:
              category:
                enum: [location, sensation, intensity, temporal, aggravating_factor, relieving_factor, functional_impact, background]
            required: [category]
          then:
            not:
              required: [question_id]

    ReportUnansweredSection:
      type: object
      additionalProperties: false
      required: [code, title_content, content]
      properties:
        code: {type: string, const: unanswered_and_uncertain}
        title_content: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        content:
          type: object
          additionalProperties: false
          required: [state, items, section_statement]
          properties:
            state: {type: string, enum: [none, present]}
            items:
              type: array
              maxItems: 200
              items: {$ref: '#/components/schemas/ReportUnansweredItem'}
            section_statement: {$ref: '#/components/schemas/ReportReviewedContentRef'}
          allOf:
            - if:
                properties: {state: {const: none}}
                required: [state]
              then:
                properties: {items: {type: array, maxItems: 0}}
            - if:
                properties: {state: {const: present}}
                required: [state]
              then:
                properties: {items: {type: array, minItems: 1}}

    ReportSourceSnapshot:
      type: object
      additionalProperties: false
      required: [source_type, source_id, event_ids, fact_refs, approval_id, confirmed_at, processing_basis, consent_receipt_id]
      properties:
        source_type:
          type: string
          enum: [user_report, confirmed_profile, confirmed_event, device_summary, uploaded_document, professional_record, agent_inference]
        source_id: {type: string, minLength: 1, maxLength: 240}
        event_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        fact_refs:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/ReportFactRef'}
        approval_id: {type: string, format: uuid}
        confirmed_at: {type: string, format: date-time}
        processing_basis: {type: string, enum: [core_service, consent]}
        consent_receipt_id: {type: [string, 'null'], format: uuid}
      allOf:
        - if:
            properties: {processing_basis: {const: core_service}}
            required: [processing_basis]
          then:
            properties: {consent_receipt_id: {type: 'null'}}
        - if:
            properties: {processing_basis: {const: consent}}
            required: [processing_basis]
          then:
            properties: {consent_receipt_id: {type: string, format: uuid}}

    ReportConsentSnapshot:
      type: object
      additionalProperties: false
      required: [consent_receipt_id, scope, notice_version, notice_digest, purpose_id, status_at_source_use, status_at_report_generation, checked_at]
      properties:
        consent_receipt_id: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/ConsentScope'}
        notice_version: {type: string, minLength: 1, maxLength: 64}
        notice_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        purpose_id: {type: string, pattern: '^[A-Za-z0-9._-]{1,120}$'}
        status_at_source_use: {type: string, const: granted}
        status_at_report_generation: {type: string, enum: [granted, withdrawn, expired, renewed_consent_required]}
        checked_at: {type: string, format: date-time}

    ReportDisclosures:
      type: object
      additionalProperties: false
      required: [ai_identity, non_diagnostic_statement, uncertainty_statement, report_generation_ai_used, ai_assisted_source_event_ids]
      properties:
        ai_identity: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        non_diagnostic_statement: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        uncertainty_statement: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        report_generation_ai_used: {type: boolean, const: false}
        ai_assisted_source_event_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items: {type: string, format: uuid}

    ReportSourcesConsentsDisclosuresSection:
      type: object
      additionalProperties: false
      required: [code, title_content, content]
      properties:
        code: {type: string, const: sources_consents_and_disclosures}
        title_content: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        content:
          type: object
          additionalProperties: false
          required: [generated_at, source_snapshots, consent_snapshots, external_source_reads_during_generation, disclosures, versions_digest]
          properties:
            generated_at: {type: string, format: date-time}
            source_snapshots:
              type: array
              minItems: 1
              maxItems: 500
              items: {$ref: '#/components/schemas/ReportSourceSnapshot'}
            consent_snapshots:
