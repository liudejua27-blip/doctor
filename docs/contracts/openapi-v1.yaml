    SafetyBaseline:
      $ref: ./agent-turn.schema.json#/$defs/SafetyBaseline

    Profile:
      type: object
      additionalProperties: false
      required: [profile_id, revision, fields, created_at, updated_at]
      properties:
        profile_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ProfileField'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileField:
      type: object
      additionalProperties: false
      required:
        - field_id
        - field_revision_id
        - stable_key
        - category
        - status
        - revision
        - supersedes_field_revision_id
        - effective_at
        - recorded_at
      properties:
        field_id:
          type: string
          format: uuid
          description: 逻辑档案字段的稳定 ID；各不可变版本共享此 ID。
        field_revision_id:
          type: string
          format: uuid
          description: 本次不可变字段版本的唯一 ID。
        stable_key:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{0,119}$'
        category:
          type: string
          enum: [age_eligibility, activity_background, work_context, stable_preference, health_context, other]
        value_type:
          type: string
          enum: [string, number, boolean, date, string_list]
        value:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: number
            - type: boolean
            - type: array
              maxItems: 100
              items:
                type: string
                minLength: 1
                maxLength: 200
        scope:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            maxLength: 120
        sensitivity:
          type: string
          enum: [standard, sensitive_health, highly_sensitive]
        source_type:
          type: string
          enum: [user_report, uploaded_document, device_summary, professional_record]
        source_id:
          type: string
          minLength: 1
          maxLength: 240
        confirmation_status:
          type: string
          const: user_confirmed
        confirmation_ref:
          type: string
          minLength: 1
          maxLength: 240
        confirmed_at:
          type: string
          format: date-time
        consent_scope:
          $ref: '#/components/schemas/ConsentScope'
        status:
          type: string
          enum: [confirmed, superseded, withdrawn, deleted]
        revision:
          type: integer
          minimum: 1
        supersedes_field_revision_id:
          type: [string, 'null']
          format: uuid
          description: revision 1 固定为 null；后续版本指向直接前一 field_revision_id。
        effective_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        tombstone_reason_code:
          type: string
          enum: [user_deleted, consent_withdrawn, retention_expired, account_deletion]
      allOf:
        - if:
            properties:
              status:
                enum: [confirmed, superseded]
            required: [status]
          then:
            required:
              - value_type
              - value
              - scope
              - sensitivity
              - source_type
              - source_id
              - confirmation_status
              - confirmation_ref
              - confirmed_at
              - consent_scope
            not:
              required: [tombstone_reason_code]
        - if:
            properties:
              status:
                enum: [withdrawn, deleted]
            required: [status]
          then:
            required: [tombstone_reason_code]
            not:
              anyOf:
                - required: [value_type]
                - required: [value]
                - required: [scope]
                - required: [sensitivity]
                - required: [source_type]
                - required: [source_id]
                - required: [confirmation_status]
                - required: [confirmation_ref]
                - required: [confirmed_at]
                - required: [consent_scope]
        - if:
            properties:
              value_type:
                const: string
            required: [value_type]
          then:
            properties:
              value:
                type: string
                minLength: 1
                maxLength: 2000
        - if:
            properties:
              value_type:
                const: number
            required: [value_type]
          then:
            properties:
              value:
                type: number
        - if:
            properties:
              value_type:
                const: boolean
            required: [value_type]
          then:
            properties:
              value:
                type: boolean
        - if:
            properties:
              value_type:
                const: date
            required: [value_type]
          then:
            properties:
              value:
                type: string
                format: date
        - if:
            properties:
              value_type:
                const: string_list
            required: [value_type]
          then:
            properties:
              value:
                type: array
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 200
        - if:
            properties:
              revision:
                const: 1
            required: [revision]
          then:
            properties:
              supersedes_field_revision_id:
                type: 'null'
        - if:
            properties:
              revision:
                minimum: 2
            required: [revision]
          then:
            properties:
              supersedes_field_revision_id:
                type: string
                format: uuid

