    get:
      tags: [Approvals]
      operationId: getApproval
      summary: 恢复当前用户的审批意图
      description: |
        仅返回当前用户拥有且仍可见的审批意图，用于中断、跨设备和 Location 恢复。
        pending 可继续批准/拒绝；终态只能查看，不能再次决定。来源 TTL 内可返回完整终态结果；
        来源清理后只返回 redacted ApprovalIntent 墓碑且 decision_result=null，不含 display_summary/Session/Turn 正文。
        不存在与无权访问统一返回 404。
      parameters:
        - $ref: '#/components/parameters/RequestId'
