  /v1/agent/sessions/{session_id}/escalation-record-draft:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      tags: [Assessment Sessions]
      operationId: reviseEscalationRecordDraft
      summary: 修正安全行动后的未确认事实草稿
      description: |
        仅用于 workflow=post_escalation_record、state=awaiting_confirmation 的当前用户 Session。
        接受完整 typed AssessmentDraft 替换和旧 digest，不调用 LLM/工具，也不能降低原 tier。
        服务端重新执行全部确定性安全规则：同级且完整时保留 SafetyBaseline/retained action 并追加
        draft_ready lifecycle Turn；R1 明确命中 R0 时原子终止 post 留档并返回 assessment+escalated；
        新安全信息不完整时返回 post+awaiting_user 的最少安全追问；重检不可用时返回
        post+failed/degraded。后两种仍固定保留原 R0/R1 行动层；四种结果均失效旧草稿/Intent，不创建 Event。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseEscalationRecordDraftRequest'
      responses:
        '200':
          description: 原子返回同级草稿、更高级升级、最少安全追问或安全重检失败之一
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviseEscalationRecordDraftResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
