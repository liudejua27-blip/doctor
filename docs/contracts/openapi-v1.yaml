openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Body Companion API
  version: 1.1.0-draft
  description: |
    面向 iOS 的身体信号记录与恢复决策助手 API。

    Agent 输出只是不可信候选数据。确定性安全规则、身份认证、对象级授权、
    用户确认、幂等、事务写入和审计均由服务端负责。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.bodycompanion.example
    description: Production placeholder
  - url: https://staging-api.bodycompanion.example
    description: Staging placeholder
security:
  - BearerAuth: []
tags:
  - name: Configuration
    description: iOS 能力协商、资产与最低契约版本；不含用户健康数据
  - name: Safety
    description: 不依赖 LLM 的确定性安全预检查
  - name: Assessment Sessions
    description: Agent 会话、Turn 和候选事实确认
  - name: Approvals
    description: 服务端可信审批决定与副作用执行
  - name: Body Signal Events
    description: 用户已确认的身体信号事件
  - name: Episodes
    description: 纵向身体问题及复查
  - name: Profile
    description: 用户确认的个人背景资料
  - name: Consents
    description: 分项同意、收据和撤回状态
  - name: Reports
    description: 不可变报告快照
  - name: User Data Rights
    description: 数据导出和删除任务
paths:
  /v1/app-config/ios:
    get:
      tags: [Configuration]
      operationId: getIOSAppConfiguration
      summary: 获取签名发布的 iOS 能力与资产配置
      description: |
        公开且不接收健康正文。客户端只使用仍在有效期且版本可识别的配置；获取失败或遇到未知
        安全关键值时 fail closed 到 2D、ManualMode/未确认草稿和公共安全入口，不自行开启专业 3D 或 Agent。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: 当前 iOS 能力配置
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOSAppConfiguration'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: 获取当前用户确认的个人档案
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: 最小化个人档案和字段来源
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: 追加或修正用户确认的个人档案字段
      description: AI 或文档提取值在用户确认前不得通过本接口成为正式档案事实。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RecentAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 档案已更新并写入审计
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/consents:
    get:
      tags: [Consents]
      operationId: getConsentStatus
      summary: 获取当前分项同意状态
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: 每个同意范围的当前状态和最新收据 ID
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/consents/grants:
    post:
      tags: [Consents]
      operationId: grantConsent
      summary: 对一个明确范围授予同意并创建不可变收据
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecentAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantConsentRequest'
      responses:
        '201':
          description: 同意收据已创建；不得覆盖旧收据
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/consents/{consent_scope}/revocations:
    parameters:
      - $ref: '#/components/parameters/ConsentScope'
    post:
      tags: [Consents]
      operationId: revokeConsent
      summary: 撤回一个同意范围并停止新的相关处理
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecentAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeConsentRequest'
      responses:
        '201':
          description: 撤回收据已创建并触发缓存/派生处理失效
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/safety/precheck:
    post:
      tags: [Safety]
      operationId: runSafetyPrecheck
      summary: 执行确定性安全预检查
      description: |
        不调用 LLM。返回的风险级别由版本化服务端规则生成。
        信息不足或规则服务不可用时不得默认返回 R3。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyPrecheckRequest'
      responses:
        '200':
          description: 安全预检查完成或返回待补充题目
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyPrecheckResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/agent/sessions:
    post:
      tags: [Assessment Sessions]
      operationId: startAssessment
      summary: 创建身体信号 AssessmentSession
      description: >-
        服务端必须验证当前用户存在仍有效、由用户确认的 age_eligibility=adult_18_plus，
        并验证核心记录/云端处理所需同意；不得信任客户端 onboarding 状态。
        未确认、已撤回或明确不符合年龄范围时不得创建 Session 或持久化健康输入。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAssessmentRequest'
      responses:
        '201':
          description: Session 已创建
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/agent/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Assessment Sessions]
      operationId: getAssessment
      summary: 获取或恢复 AssessmentSession
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: 当前 Session 状态；不包含 Provider 原始消息或隐藏推理
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Assessment Sessions]
      operationId: discardAssessmentDraft
      summary: 丢弃当前 Session 的未确认草稿并使会话失效
      description: >-
        只允许处理尚未持久化为正式 Event 的草稿；已确认历史不受影响，操作写入最小审计记录。
        若 Session 正在 awaiting_approval，服务端必须在同一事务将该 Session 尚未执行的 ApprovalIntent
        标为 invalidated；旧 approval_id 后续决定必须无副作用地拒绝。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '204':
          description: 未确认草稿已丢弃、相关未执行审批已失效；重复调用保持成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/agent/sessions/{session_id}/turns:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Assessment Sessions]
      operationId: submitAssessmentAnswer
      summary: 提交一轮用户输入并异步运行受控 Agent
      description: |
        Turn 只能生成候选结构或下一步动作，不能直接创建正式 BodySignalEvent。
        同一 Session 同时只允许一个运行中的 Turn。
        每次提交都重新验证当前 age_eligibility 和所需 ConsentScope；撤回后不得继续处理旧 Session。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTurnRequest'
      responses:
        '202':
          description: Turn 已排队或正在运行
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTurn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/agent/sessions/{session_id}/turns/{turn_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [Assessment Sessions]
      operationId: getAssessmentTurn
      summary: 查询异步 Agent Turn
      description: 只返回仍在来源 TTL 内的 Turn 投影；草稿过期、用户丢弃或同意撤回并清理正文后返回 410，不从审计或幂等缓存还原。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Turn 当前状态和强类型输出
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTurn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/agent/sessions/{session_id}/draft:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      tags: [Assessment Sessions]
      operationId: reviseAssessmentDraft
      summary: 修改普通、手动或不支持场景中的未确认事实草稿
      description: |
        仅接受 workflow=assessment、state=awaiting_confirmation 且尚未过期的当前用户 Session。
        客户端提交完整 typed AssessmentDraft、当前 Turn、revision 与旧 digest；服务端以确定性 Application
        流程重验八个事实组、本体引用和全部安全规则，不调用 LLM 或 Agent 工具。complete 且为 R2/R3 时
        追加 draft_revised Turn；命中 R0/R1 时追加 draft_revision_escalated Turn；安全问题尚缺时追加
        draft_revision_safety_recheck_required Turn；安全服务不可用时追加 draft_revision_safety_recheck_failed Turn。
        四种结果都会使旧 digest 和旧未执行 Intent 失效，且不会创建正式 Event。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseAssessmentDraftRequest'
      responses:
        '200':
          description: 原子返回 revision+1 的 Session 与最新 Application lifecycle Turn
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviseAssessmentDraftResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/agent/sessions/{session_id}/retries:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Assessment Sessions]
      operationId: retryAssessmentTurn
      summary: 重试一个保留了输入且明确可重试的失败 Turn
      description: |
        failed_turn_id 必须是同一 Session 当前 latest failed Turn，至少一个错误 retryable=true，且
        SafeFailureOutput.input_preserved=true。服务端不修改旧 Turn，而是追加 input.event=turn_retry_started
        的 queued lifecycle Turn 并原子递增 Session revision。assessment 重试可重新运行受控 Agent；
        post_escalation_record 重试仍禁止 LLM/工具并保留 retained_safety_action。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryAssessmentTurnRequest'
      responses:
        '202':
          description: 新重试 Turn 已排队
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryTurnResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/agent/sessions/{session_id}/confirmations:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Assessment Sessions]
      operationId: requestDraftConfirmation
      summary: 提交用户复核后的候选事实并创建审批意图
      description: |
        本接口不会直接写入正式身体事件。生产实现必须先复用已验证的 P2B typed ConfirmationIntent
        application boundary，重新执行 Schema、本体、业务和安全校验，再在同一事务创建 ApprovalIntent、
        application-origin approval_required Turn，
        并把 Session 推进 awaiting_approval、更新 latest_turn_id。
        服务端必须再次验证当前 age_eligibility、同意和安全状态。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfirmationIntentRequest'
      responses:
        '201':
          description: 审批意图已创建，尚未执行正式写入
          headers:
            X-Request-ID:
