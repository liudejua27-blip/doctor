  /v1/approvals/{approval_id}/decisions:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: 批准或拒绝一个服务端审批意图并返回动作资源
      description: |
        approve 前服务端必须重新认证和授权，并校验 intent_digest、资源 revision、有效期、
        当前 age_eligibility、同意和安全状态。PydanticAI HITL 不是授权机制。
        本 v1 端点等待动作进入终态后返回 200；执行期间服务端原子投影 executing Turn/persisting Session，
        并发恢复客户端可通过 Session.latest_turn_id 轮询，终态响应必须携带 session_snapshot/latest_turn。
        新 Intent revision=1；每次持久化状态变化严格 +1。pending N 的 approve 终态为 N+3
        （approved N+1、executing N+2、executed/failed N+3），deny/直接 invalidated 为 N+1。
        精确 Idempotency-Key 重放在 revision 校验前返回首次保存的同一终态结果；非重放的旧 revision 失败。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ConditionalRecentAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: 决定已处理；重复请求返回同一执行结果
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/ApprovalExpired'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

