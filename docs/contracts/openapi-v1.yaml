          properties:
            used: {type: boolean, const: true}
            agent_version: {type: string, minLength: 1, maxLength: 64}
            model_provider: {type: string, minLength: 1, maxLength: 160}
            model_name: {type: string, minLength: 1, maxLength: 160}
            model_version: {type: string, minLength: 1, maxLength: 160}

    ReportSourceEventVersion:
      type: object
      additionalProperties: false
      required: [event_id, resource_revision, correction_sequence, event_digest, health_schema_version, safetyBaselineId, ai_runtime]
      properties:
        event_id: {type: string, format: uuid}
        resource_revision: {type: integer, minimum: 1}
        correction_sequence: {type: integer, minimum: 1}
        event_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        health_schema_version: {type: string, minLength: 1, maxLength: 64}
        safetyBaselineId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,120}$'
        ai_runtime: {$ref: '#/components/schemas/ReportAIRuntime'}

    ReportVersions:
      type: object
      additionalProperties: false
      required:
        - report_contract_version
        - report_generator_version
        - report_projector_version
        - report_template_version
        - report_renderer_version
        - report_content_release_id
        - generation_baseline
        - source_event_versions
        - safety_baselines
      properties:
        report_contract_version: {type: string, const: '1.0'}
        report_generator_version:
          type: string
          minLength: 1
          maxLength: 64
          description: 报告生成编排器版本；不等同于事实投影算法。
        report_projector_version:
          type: string
          minLength: 1
          maxLength: 64
          description: 从 confirmed Event 到八个 typed Section 的确定性投影算法版本。
        report_template_version: {type: string, minLength: 1, maxLength: 64}
        report_renderer_version: {type: string, minLength: 1, maxLength: 64}
        report_content_release_id: {type: string, minLength: 1, maxLength: 64}
        generation_baseline: {$ref: '#/components/schemas/SafetyBaselineSnapshot'}
        source_event_versions:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/ReportSourceEventVersion'}
        safety_baselines:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/SafetyBaselineSnapshot'}

    MandatoryReportDisclosures:
      type: object
      additionalProperties: false
      required: [ai_identity, non_diagnostic_statement, uncertainty_statement]
      properties:
        ai_identity: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        non_diagnostic_statement: {$ref: '#/components/schemas/ReportReviewedContentRef'}
        uncertainty_statement: {$ref: '#/components/schemas/ReportReviewedContentRef'}

    CreateReportShareRequest:
      type: object
      additionalProperties: false
      required: [report_version, field_scope, delivery_method, recipient_class, expires_at, notice_digest, mandatory_disclosures_digest]
      properties:
        report_version:
          type: integer
          minimum: 1
        field_scope:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - report_scope
              - body_locations
              - confirmed_signals
              - trend_summary
              - safety_summary
              - guidance_and_monitoring
              - unanswered_and_uncertain
              - sources_and_consents
              - body_map_2d
          description: '`body_map_2d` 未被明确选择时排除身体位置图；`sources_and_consents` 控制可选来源/同意细节，但 AI 身份、非诊断和不确定性声明始终强制包含且不属于可选范围。'
        delivery_method:
          type: string
          enum: [expiring_link, system_share_sheet_file]
        recipient_class:
          type: string
          enum: [self, coach_or_trainer, healthcare_professional, family_or_caregiver, other]
        recipient_label:
          type: string
          minLength: 1
          maxLength: 200
          description: 可选的用户自定义显示标签；不得要求手机号、邮箱或真实姓名，进入审批摘要和审计时按敏感数据处理。
        expires_at:
          type: string
          format: date-time
        notice_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        mandatory_disclosures_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: 用户确认页实际展示的三项强制声明规范化摘要；服务端必须与报告冻结内容一致。

    RevokeReportShareRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500

    RecordReportShareDeliveryDecisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, decision, occurred_at]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        decision:
          type: string
          enum: [completed, cancelled, failed]
        occurred_at:
          type: string
          format: date-time

    ReportShare:
      type: object
      additionalProperties: false
      required:
        - share_id
        - report_id
        - report_version
        - approval_id
        - field_scope
        - mandatory_disclosures
        - mandatory_disclosures_digest
        - share_projection_digest
        - artifact_content_digest
        - delivery_method
        - recipient_class
        - status
        - revision
        - access_kind
        - access_url
        - artifact_id
        - created_at
        - expires_at
        - revoked_at
        - delivered_at
        - cancelled_at
        - cancellation_reason
      properties:
        share_id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        report_version:
          type: integer
          minimum: 1
        approval_id:
          type: string
          format: uuid
        field_scope:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - report_scope
              - body_locations
              - confirmed_signals
              - trend_summary
              - safety_summary
              - guidance_and_monitoring
              - unanswered_and_uncertain
              - sources_and_consents
              - body_map_2d
          description: '实际获准的可选字段集合；三项 mandatory_disclosures 无论本数组选择如何都必须进入所有分享产物。'
        mandatory_disclosures:
          $ref: '#/components/schemas/MandatoryReportDisclosures'
        mandatory_disclosures_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        share_projection_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: 绑定 report ID/version、规范化 field_scope 和 mandatory_disclosures_digest 的服务端投影摘要。
        artifact_content_digest:
          type: [string, 'null']
          pattern: '^sha256:[a-f0-9]{64}$'
          description: system share 临时投影文件的字节摘要；不得复用完整报告原始 artifact。
        delivery_method:
          type: string
          enum: [expiring_link, system_share_sheet_file]
        recipient_class:
          type: string
          enum: [self, coach_or_trainer, healthcare_professional, family_or_caregiver, other]
        recipient_label:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [prepared, active, delivered, cancelled, expired, revoked]
        revision:
          type: integer
          minimum: 1
        access_url:
          type: [string, 'null']
          format: uri
          description: 短期、可撤回 URL；不得是永久公开对象存储地址。
        access_kind:
          type: [string, 'null']
          enum: [recipient_link, file_download, null]
        artifact_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancellation_reason:
          type: [string, 'null']
          enum: [user_cancelled, share_sheet_failed, null]
      allOf:
        - if:
            properties: {delivery_method: {const: system_share_sheet_file}}
            required: [delivery_method]
          then:
            properties:
              artifact_content_digest:
                type: string
                pattern: '^sha256:[a-f0-9]{64}$'
        - if:
            properties: {delivery_method: {const: expiring_link}}
            required: [delivery_method]
          then:
            properties: {artifact_content_digest: {type: 'null'}}
        - if:
            properties: {status: {const: active}}
            required: [status]
          then:
            properties:
              access_url:
                type: string
                format: uri
              access_kind:
                const: recipient_link
              delivery_method: {const: expiring_link}
              artifact_id: {type: 'null'}
            required: [access_url, access_kind, delivery_method]
        - if:
            properties: {status: {const: prepared}}
            required: [status]
          then:
            properties:
              delivery_method: {const: system_share_sheet_file}
              access_url:
                type: string
                format: uri
              access_kind: {const: file_download}
              artifact_id:
                type: string
                format: uuid
            required: [access_url, access_kind, artifact_id]
        - if:
            properties: {status: {enum: [delivered, cancelled, expired, revoked]}}
            required: [status]
          then:
            properties:
              access_url: {type: 'null'}
              access_kind: {type: 'null'}
        - if:
            properties: {status: {const: delivered}}
            required: [status]
          then:
            properties:
              delivery_method: {const: system_share_sheet_file}
              delivered_at:
                type: string
                format: date-time
              cancelled_at: {type: 'null'}
              cancellation_reason: {type: 'null'}
        - if:
            properties: {status: {const: cancelled}}
            required: [status]
          then:
            properties:
              delivery_method: {const: system_share_sheet_file}
              delivered_at: {type: 'null'}
              cancelled_at:
                type: string
                format: date-time
              cancellation_reason:
                type: string
                enum: [user_cancelled, share_sheet_failed]
              artifact_id:
                type: string
                format: uuid
        - if:
            properties: {status: {const: delivered}}
            required: [status]
          then:
            properties:
              artifact_id:
                type: string
                format: uuid
        - if:
            properties: {status: {const: revoked}}
            required: [status]
          then:
            properties:
              delivery_method: {const: expiring_link}
              revoked_at:
                type: string
                format: date-time
        - if:
            properties: {status: {enum: [prepared, active, delivered, cancelled, expired]}}
            required: [status]
          then:
            properties:
              revoked_at: {type: 'null'}
        - if:
            properties: {status: {enum: [prepared, active, expired, revoked]}}
            required: [status]
          then:
            properties:
              delivered_at: {type: 'null'}
              cancelled_at: {type: 'null'}
              cancellation_reason: {type: 'null'}

    CreateDataExportRequest:
      type: object
      additionalProperties: false
      required: [format, scopes]
      properties:
        format:
          type: string
          enum: [json_zip, human_readable_zip]
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [profile, consents, episodes, events, reports, shares, audit_summary]

    CreateDeletionRequest:
      type: object
      additionalProperties: false
      required: [scope, target_ids, acknowledgement_digest]
      properties:
        scope:
          type: string
          enum: [selected_resources, all_health_data, account]
        target_ids:
          type: array
          uniqueItems: true
          maxItems: 500
          items:
            type: string
            format: uuid
        acknowledgement_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        reason:
          type: string
          minLength: 1
          maxLength: 500
      allOf:
        - if:
            properties: {scope: {const: selected_resources}}
            required: [scope]
          then:
            properties:
              target_ids:
                type: array
                minItems: 1
        - if:
            properties: {scope: {enum: [all_health_data, account]}}
            required: [scope]
          then:
            properties:
              target_ids:
                type: array
                maxItems: 0

    AcknowledgeDeviceDeletionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, installation_id, cleared_categories, cleared_at, ios_build_version, receipt_digest]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        installation_id:
          type: string
          format: uuid
        cleared_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [offline_drafts, cached_events, cached_reports, temporary_share_files, agent_cache, local_search_index, notification_content, credentials_and_keys]
        cleared_at:
          type: string
          format: date-time
        ios_build_version:
          type: string
          minLength: 1
          maxLength: 64
        receipt_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'

    DeviceDeletionReceipt:
      type: object
      additionalProperties: false
      required: [receipt_id, installation_id, cleared_categories, cleared_at, ios_build_version, receipt_digest, recorded_at]
      properties:
        receipt_id:
          type: string
          format: uuid
        installation_id:
          type: string
          format: uuid
        cleared_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [offline_drafts, cached_events, cached_reports, temporary_share_files, agent_cache, local_search_index, notification_content, credentials_and_keys]
        cleared_at:
          type: string
          format: date-time
        ios_build_version:
          type: string
          minLength: 1
          maxLength: 64
        receipt_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        recorded_at:
          type: string
          format: date-time

    LocalCleanupEvidence:
      type: object
      additionalProperties: false
      required: [evidence_type, installation_id, evidence_ref, recorded_at]
      properties:
        evidence_type:
          type: string
          enum: [device_receipt, encryption_key_revocation, installation_expired]
        installation_id:
          type: string
          format: uuid
        evidence_ref:
          type: string
          minLength: 1
          maxLength: 240
        recorded_at:
          type: string
          format: date-time

    DataRightsJob:
      type: object
      additionalProperties: false
      required:
        - job_id
        - job_type
        - revision
        - status
        - deletion_scope
        - target_ids
        - export_scopes
        - stages
        - device_receipts
        - local_cleanup_evidence
        - download_url
        - download_expires_at
        - retention_exceptions
        - requested_at
        - estimated_completion_at
        - completed_at
      properties:
        job_id:
          type: string
          format: uuid
        job_type:
          type: string
          enum: [data_export, deletion]
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [queued, running, completed, partially_completed, failed, cancelled]
        deletion_scope:
          type: [string, 'null']
          enum: [selected_resources, all_health_data, account, null]
        target_ids:
          type: array
          uniqueItems: true
          maxItems: 500
          items:
            type: string
            format: uuid
        export_scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [profile, consents, episodes, events, reports, shares, audit_summary]
        stages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [store, status]
            properties:
              store:
                type: string
                enum:
                  - primary_database
                  - object_storage_and_thumbnails
                  - search_and_vector_indexes
                  - cache_and_queues
                  - reports_and_share_links
                  - model_and_ocr_providers
                  - analytics_and_exports
                  - backup_lifecycle
                  - local_device_cache
                  - long_term_memory_and_derived_features
              status:
                type: string
                enum: [pending, running, awaiting_client_confirmation, completed, retained_exception, failed, cancelled, not_applicable]
              detail:
                type: string
                minLength: 1
                maxLength: 500
        device_receipts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DeviceDeletionReceipt'
        local_cleanup_evidence:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LocalCleanupEvidence'
        download_url:
          type: [string, 'null']
          format: uri
          description: 仅导出任务完成后存在的短期、单用户凭证 URL。
        download_expires_at:
          type: [string, 'null']
          format: date-time
        retention_exceptions:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [store, category, reason, expected_release_at]
            properties:
              store:
                type: string
                enum:
                  - primary_database
                  - object_storage_and_thumbnails
                  - search_and_vector_indexes
                  - cache_and_queues
                  - reports_and_share_links
                  - model_and_ocr_providers
                  - analytics_and_exports
                  - backup_lifecycle
                  - local_device_cache
                  - long_term_memory_and_derived_features
              category:
                type: string
                minLength: 1
                maxLength: 120
              reason:
                type: string
                minLength: 1
                maxLength: 500
              expected_release_at:
                type: string
                format: date-time
        requested_at:
          type: string
          format: date-time
        estimated_completion_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
      allOf:
        - if:
            properties: {job_type: {const: deletion}}
            required: [job_type]
          then:
            properties:
              stages:
                type: array
                minItems: 10
                maxItems: 10
              deletion_scope:
                type: string
                enum: [selected_resources, all_health_data, account]
              export_scopes:
                type: array
                maxItems: 0
              download_url: {type: 'null'}
              download_expires_at: {type: 'null'}
        - if:
            properties: {job_type: {const: data_export}}
            required: [job_type]
          then:
            properties:
              deletion_scope: {type: 'null'}
              target_ids:
                type: array
                maxItems: 0
              export_scopes:
                type: array
                minItems: 1
              device_receipts:
                type: array
                maxItems: 0
              local_cleanup_evidence:
                type: array
                maxItems: 0
              retention_exceptions:
                type: array
                maxItems: 0
        - if:
            properties: {deletion_scope: {const: selected_resources}}
            required: [deletion_scope]
          then:
            properties:
              target_ids:
                type: array
                minItems: 1
        - if:
            properties: {deletion_scope: {enum: [all_health_data, account]}}
            required: [deletion_scope]
          then:
            properties:
              target_ids:
                type: array
                maxItems: 0
        - if:
            properties: {status: {enum: [completed, partially_completed, failed, cancelled]}}
            required: [status]
          then:
            properties:
              completed_at:
                type: string
                format: date-time
        - if:
            properties: {status: {const: completed}}
            required: [status]
          then:
            properties:
              stages:
                type: array
                items:
                  type: object
                  properties:
                    status: {enum: [completed, not_applicable]}
                  required: [status]
        - if:
            properties: {status: {const: queued}}
            required: [status]
          then:
            properties:
              stages:
                type: array
                items:
                  type: object
                  properties:
                    status: {enum: [pending, not_applicable]}
                  required: [status]
                contains:
                  type: object
                  properties: {status: {const: pending}}
                  required: [status]
                minContains: 1
        - if:
            properties: {status: {const: running}}
            required: [status]
          then:
            properties:
              stages:
                type: array
                items:
                  type: object
                  properties:
                    status: {enum: [pending, running, completed, retained_exception, not_applicable, awaiting_client_confirmation]}
                  required: [status]
                contains:
                  type: object
                  properties:
                    status: {enum: [running, awaiting_client_confirmation]}
                  required: [status]
                minContains: 1
        - if:
            properties: {status: {const: partially_completed}}
            required: [status]
          then:
            properties:
              stages:
                type: array
                items:
                  type: object
                  properties:
                    status: {enum: [completed, failed, retained_exception, not_applicable, awaiting_client_confirmation]}
                  required: [status]
                contains:
                  type: object
                  properties:
                    status: {enum: [failed, retained_exception, awaiting_client_confirmation]}
                  required: [status]
                minContains: 1
        - if:
            properties: {status: {const: failed}}
            required: [status]
          then:
            properties:
              stages:
                type: array
                items:
                  type: object
                  properties:
                    status: {enum: [completed, failed, retained_exception, not_applicable]}
                  required: [status]
                contains:
                  type: object
                  properties: {status: {const: failed}}
                  required: [status]
                minContains: 1
        - if:
            properties: {status: {const: cancelled}}
            required: [status]
          then:
            properties:
              stages:
                type: array
                items:
                  type: object
                  properties:
                    status: {enum: [completed, cancelled, not_applicable]}
                  required: [status]
                contains:
                  type: object
                  properties: {status: {const: cancelled}}
                  required: [status]
                minContains: 1
        - if:
            properties:
              stages:
                type: array
                contains:
                  type: object
                  properties: {status: {const: retained_exception}}
                  required: [status]
            required: [stages]
          then:
            properties:
              retention_exceptions:
                type: array
                minItems: 1
        - if:
            properties:
              retention_exceptions:
                type: array
                minItems: 1
            required: [retention_exceptions]
          then:
            properties:
              stages:
                type: array
                contains:
                  type: object
                  properties: {status: {const: retained_exception}}
                  required: [status]
                minContains: 1
        - if:
            properties:
              stages:
                type: array
                contains:
                  type: object
                  properties:
                    store: {const: local_device_cache}
                    status: {const: completed}
                  required: [store, status]
            required: [stages]
          then:
            properties:
              local_cleanup_evidence:
                type: array
                minItems: 1
        - if:
            properties:
              job_type: {const: data_export}
              status: {enum: [completed, partially_completed]}
            required: [job_type, status]
          then:
            properties:
              download_url:
                type: string
                format: uri
              download_expires_at:
                type: string
                format: date-time
        - if:
            properties:
              job_type: {const: data_export}
              status: {enum: [queued, running, failed, cancelled]}
            required: [job_type, status]
          then:
            properties:
              download_url: {type: 'null'}
              download_expires_at: {type: 'null'}
        - if:
            properties: {status: {enum: [queued, running]}}
            required: [status]
          then:
            properties:
              completed_at: {type: 'null'}

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - AUTHENTICATION_REQUIRED
                - RECENT_AUTH_REQUIRED
                - AGE_ELIGIBILITY_REQUIRED
                - AGE_NOT_ELIGIBLE
                - CONSENT_REQUIRED
                - ACTION_NOT_ALLOWED
                - RESOURCE_NOT_FOUND
                - SESSION_BUSY
                - IDEMPOTENCY_KEY_REUSED
                - IDEMPOTENCY_REQUEST_IN_PROGRESS
                - APPROVAL_EXPIRED
                - APPROVAL_INTENT_MISMATCH
                - REVISION_MISMATCH
                - DRAFT_DIGEST_MISMATCH
                - UNCONFIRMED_DRAFT_EXPIRED
                - VALIDATION_FAILED
                - AGENT_OUTPUT_INVALID
                - REPORT_SOURCE_NOT_CONFIRMED
                - REPORT_SOURCE_INCOMPLETE
                - REPORT_BASELINE_UNRESOLVABLE
                - REPORT_CONTENT_UNRESOLVABLE
                - REPORT_RENDER_VALIDATION_FAILED
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - MODEL_UNAVAILABLE
                - SAFETY_SERVICE_UNAVAILABLE
                - UPSTREAM_TIMEOUT
                - INTERNAL_ERROR
            message:
              type: string
              minLength: 1
              maxLength: 1000
            request_id:
              type: string
              format: uuid
            retryable:
              type: boolean
            details:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [reason]
                properties:
                  field:
                    type: string
                    maxLength: 240
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 500

  responses:
    Unauthorized:
      description: 未认证或 token 无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 缺少近期认证、有效同意或当前动作权限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或当前用户无权获知其存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 幂等键冲突、请求仍执行中或 Session Busy
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: 临时草稿、留档复核窗口或资源已按保留策略到期，旧请求不得恢复副作用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ApprovalExpired:
      description: 审批意图已经过期
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: revision 或 If-Match 不匹配
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: 请求或 Agent 候选结构无法通过校验
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求超过速率限制
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 模型、安全规则或其他关键依赖不可用；安全服务不可用时必须 fail-closed
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamTimeout:
      description: 上游超时；有副作用请求必须使用同一 Idempotency-Key 重试
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 未处理的内部错误；不得暴露异常栈、Prompt、查询或敏感正文
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
