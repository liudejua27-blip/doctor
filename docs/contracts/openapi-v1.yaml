              maxItems: 100
              items: {$ref: '#/components/schemas/ReportConsentSnapshot'}
            external_source_reads_during_generation: {type: boolean, const: false}
            disclosures: {$ref: '#/components/schemas/ReportDisclosures'}
            versions_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}

    SafetyBaselineSnapshot:
      type: object
      additionalProperties: false
