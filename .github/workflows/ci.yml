name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-contracts:
    name: Backend and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints-test.txt
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -c backend/constraints-test.txt
          -e "./backend[test]"
      - name: Validate documentation and contracts
        run: python scripts/check_baseline.py
      - name: Compile Python sources
        run: python -m compileall -q backend/src backend/tests scripts
      - name: Run backend tests
        run: python -m pytest backend/tests --tb=short
      - name: Verify installed dependencies
        run: python -m pip check

  ios:
    name: iOS package and internal host
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Swift tests
        working-directory: ios/BodyCompanion
        run: swift test
      - name: Build iOS SDK target
        working-directory: ios/BodyCompanion
        run: >-
          swift build
          --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
          --triple arm64-apple-ios17.0
          --target BodyCompanionIOS
      - name: Verify internal iOS App Host boundary
        run: python3 scripts/check_internal_ios_host.py
      - name: Run internal iOS App Host smoke
        run: bash scripts/run_internal_ios_host_tests.sh
